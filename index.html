<style>
  :root{--ink:#eef3fa;--panel:rgba(8,16,32,.55);--edge:rgba(255,255,255,.16);--gold:#ffd98a}
  *{margin:0;padding:0;box-sizing:border-box}

  .unit+.unit::before{content:"";position:absolute;left:-.45em;top:12%;height:76%;width:1px;background:var(--edge)}
  .unit b{display:block;font-size:clamp(26px,5.2vw,54px);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;text-shadow:0 2px 18px rgba(0,0,0,.5)}
  .unit span{font-size:clamp(9px,1.4vw,12px);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);opacity:.95}
  #cap{bottom:162px;left:50%;transform:translateX(-50%);padding:6px 14px;font-size:clamp(10px,1.5vw,13px);color:rgba(238,243,250,.85);letter-spacing:.1em;white-space:nowrap;border-radius:999px}
  #cap b{color:var(--gold)}
  #weatherBox{top:22px;right:22px;padding:10px 14px;font-size:clamp(10px,1.4vw,13px);text-align:right;line-height:1.5}

  #note{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:10;font-size:clamp(9px,1.2vw,12px);letter-spacing:.18em;text-transform:uppercase;color:rgba(238,243,250,.6);text-shadow:0 1px 8px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap}
  #btnSim{bottom:22px;right:22px;pointer-events:auto;cursor:pointer;border:none;outline:none;color:var(--ink);font:inherit;font-size:12px;letter-spacing:.08em;padding:9px 12px;border-radius:12px;border:1px solid var(--edge);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #btnSim:hover{background:rgba(255,255,255,.12)}
  #panel{z-index:20;right:22px;bottom:74px;padding:14px;pointer-events:auto}

  #panel button.on{background:rgba(255,217,138,.85);color:#10233f;border-color:transparent;font-weight:600}
  #panel button:hover{background:rgba(255,255,255,.16)}
  #done{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(5,10,22,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #done .big{font-size:clamp(30px,7vw,84px);font-weight:700;color:var(--gold);text-align:center;text-shadow:0 4px 40px rgba(0,0,0,.6);padding:0 20px}
  #done .big small{display:block;font-size:clamp(13px,2.4vw,22px);color:var(--ink);margin-top:14px;letter-spacing:.25em;text-transform:uppercase}

<script>
(function(){
"use strict";
var TAU = Math.PI*2;
var TARGET = new Date(Date.UTC(2027,10,13,23,0,0));
var LAT = 48.8722, LON = 2.7762;

var canvas = document.getElementById('scene');
var ctx = canvas.getContext('2d');
var cw = 0, ch = 0, dpr = 1;
var DESIGN_W = 1600, DESIGN_H = 900;
var viewW = 0, viewH = 0, sceneScale = 1, sceneOX = 0, sceneOY = 0;
var simT = 0, lastT = performance.now(), cldT = 0;

var mode = 'auto';
var scene = 'hotel';
var W = { temp:14, code:2, clouds:0.25, rain:0, snow:0, wind:10, windDir:200, fog:0, condition:'Cielo despejado' };
var S = { clouds:0.25, rain:0, snow:0, wind:10, fog:0 };

function clamp(x,a,b){ return x<a?a:(x>b?b:x); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smooth(a,b,x){ var t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function mixc(a,b,t){ t=clamp(t,0,1); return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function cstr(c,a){ return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a===undefined?1:a)+')'; }
function rnd(n){ var s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); }

function solar(now){
  var n = (now/86400000) + 2440587.5 - 2451545.0;
  var L0 = ((280.460 + 0.9856474*n) % 360) * Math.PI/180;
  var g  = ((357.528 + 0.9856003*n) % 360) * Math.PI/180;
  var ecl = (23.439 - 0.0000004*n) * Math.PI/180;
  var lambda = L0 + (1.915*Math.sin(g) + 0.020*Math.sin(2*g))*Math.PI/180;
  var dec = Math.asin(Math.sin(ecl)*Math.sin(lambda));
  var ra = Math.atan2(Math.cos(ecl)*Math.sin(lambda), Math.cos(lambda));
  var gmst = (280.46061837 + 360.98564736629*n) * Math.PI/180;
  var lst = gmst + LON*Math.PI/180;
  var ha = ((lst - ra) % TAU);
  if(ha > Math.PI) ha -= TAU;
  if(ha < -Math.PI) ha += TAU;
  var lat = LAT*Math.PI/180;
  var elev = Math.asin(Math.sin(lat)*Math.sin(dec) + Math.cos(lat)*Math.cos(dec)*Math.cos(ha));
  var az = ((Math.atan2(Math.sin(ha), Math.cos(ha)*Math.sin(lat) - Math.tan(dec)*Math.cos(lat)) + Math.PI) % TAU + TAU) % TAU;
  return {elev:elev, az:az};
}

function projectCel(elev, az){
  var reldir = Math.sin(az - Math.PI);
  var x = cw*0.5 + reldir*cw*0.42;
  var y = ch*0.60 - Math.tan(elev)*cw*0.46;
  return {x:x, y:y, visible: reldir > -1.15 && reldir < 1.15};
}

function sunState(now){
  var so = solar(now);
  var day = smooth(-0.12, 0.08, so.elev);
  var golden = clamp(smooth(0.30, 0.02, so.elev) - smooth(0.02, -0.28, so.elev), 0, 1)*0.9;
  return {sun:projectCel(so.elev, so.az), elev:so.elev, az:so.az, day:day, golden:golden};
}

function applyMode(){
  var st = sunState(new Date());
  var d=st.day, cl=W.clouds, r=W.rain, so=W.snow, w=W.wind, fg=W.fog;
  if(mode==='day'){ d=1; cl=0.22; r=0; so=0; w=12; fg=0; }
  else if(mode==='night'){ d=0; cl=0.18; r=0; so=0; w=8; fg=0; }
  else if(mode==='dusk'){ d=0.5; cl=0.3; r=0; so=0; w=8; fg=0.1; }
  else if(mode==='rain'){ d=0.72; cl=0.97; r=0.8; so=0; w=34; fg=0.15; }
  else if(mode==='snow'){ d=0.5; cl=0.88; r=0; so=0.85; w=18; fg=0.25; }
  else if(mode==='storm'){ d=0.35; cl=1; r=0.95; so=0; w=62; fg=0.2; }
  else if(mode==='wind'){ d=0.78; cl=0.5; r=0; so=0; w=72; fg=0; }
  st.day=d; st.clouds=cl; st.rain=r; st.snow=so; st.wind=w; st.fog=fg;
  return st;
}

var windows = [];
function buildWindows(){
  windows = [];
  var wallL = 0.26*cw, wallR = 0.74*cw;
  var cols = 12, rows = 4;
  var gap = (wallR-wallL)/cols;
  var ww = gap*0.42, wh = 0.031*ch;
  var rowYs = [0.282,0.334,0.386,0.438];
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      var x = wallL + c*gap + (gap-ww)/2;
      windows.push({x:x, y:rowYs[r]*ch - wh/2, w:ww, h:wh, on: rnd(c*31.7+r*17.3) > 0.45, pass: rnd(c+r*5.3), lit: Math.random() < 0.3, ch: 3+Math.random()*14});
    }
  }
  var wingRects = [[0,0.26*cw],[0.74*cw,cw]];
  var wingRows = [0.30,0.34,0.38,0.42];
  var whW = 0.028*ch;
  for(var wn=0;wn<2;wn++){
    var x0=wingRects[wn][0], x1=wingRects[wn][1];
    var wc=8, wg=(x1-x0)/wc, wwW=wg*0.42;
    for(var c=0;c<wc;c++){
      for(var r=0;r<4;r++){
        var x = x0 + c*wg + (wg-wwW)/2;
        windows.push({x:x, y:wingRows[r]*ch - whW/2, w:wwW, h:whW, on:true, pass:rnd(c*3.1+r*7.7), lit: Math.random() < 0.3, ch: 3+Math.random()*14});
      }
    }
  }
}

var DAY_SKY_TOP=[64,150,226], DAY_SKY_MID=[130,196,242], DAY_SKY_LOW=[205,232,250];
var OVC_SKY_TOP=[102,112,130], OVC_SKY_MID=[135,146,162], OVC_SKY_LOW=[176,188,200];
var NIT_SKY_TOP=[5,11,26], NIT_SKY_MID=[16,30,60], NIT_SKY_LOW=[40,62,96];
var DUSK_TOP=[108,121,165], DUSK_MID=[158,132,172], DUSK_LOW=[226,166,128];
var WALL=[232,224,206], WALL_SH=[206,196,176], TRIM=[244,241,232];
var ROOF=[27,62,89], ROOF_D=[19,46,68], SHUT=[40,60,78];
var NAVY=[30,44,66];
var GLASS_DAY=[150,190,226], GLASS_DRK=[104,130,160];
var LAMP=[255,213,138], LAMP_GLOW=[255,190,90];
var GOLD=[255,190,45], GOLD_GLOW=[255,170,30];
var TREE=[70,128,84], TREE_D=[45,92,60], TREE_L=[98,156,104], PINE=[52,96,70];

var raindrops=[], snowflakes=[], leaves=[];
var stars=[];
(function(){
  for(var i=0;i<140;i++){ stars.push({x:Math.random(), y:Math.random()*0.5, r:Math.random()*1.3+0.4, p:Math.random()*TAU}); }
})();
var cloudsL=[];
(function(){
  for(var i=0;i<6;i++){ cloudsL.push({x:Math.random(), y:0.04+Math.random()*0.28, s:0.7+Math.random()*1.6, o:0.5+Math.random()*0.5}); }
})();

var curLitAmt = 0.18;
function updateWindows(dt){
  var p = clamp(curLitAmt*0.92, 0.05, 0.98);
  for(var i=0;i<windows.length;i++){
    var wp = windows[i];
    if(simT < wp.ch) continue;
    wp.lit = Math.random() < p;
    wp.ch = simT + (wp.lit ? 20+Math.random()*45 : 8+Math.random()*24);
  }
}
function mgmtParticles(){
  var targetRain = clamp(S.rain,0,1)*cw*0.5;
  while(raindrops.length < targetRain && raindrops.length<900){
    raindrops.push({x:Math.random()*cw, y:Math.random()*ch, sp:cw*0.02*(0.75+Math.random()*0.6), l:ch*0.03*(0.6+Math.random()*0.5)});
  }
  if(raindrops.length > targetRain) raindrops.length = Math.floor(targetRain);
  var targetSnow = clamp(S.snow,0,1)*cw*0.35;
  while(snowflakes.length < targetSnow && snowflakes.length<700){
    snowflakes.push({x:Math.random()*cw, y:Math.random()*ch, r:1.2+Math.random()*2.6*(0.6+S.snow), vy:cw*0.006*(0.5+Math.random()*0.7), p:Math.random()*TAU});
  }
  if(snowflakes.length > targetSnow) snowflakes.length = Math.floor(targetSnow);
}

function spawnLeaves(dt){
  var rate = clamp((S.wind-22)/55,0,1);
  if(leaves.length<60 && Math.random() < rate*dt*30){
    var fromLeft = Math.random()<0.5;
    var spd = cw*(0.25+Math.random()*0.35)*(0.5+S.wind*0.012);
    leaves.push({x:fromLeft?-30:cw+30, y:0.1*ch+Math.random()*0.5*ch, vx:(fromLeft?1:-1)*spd, vy:cw*0.012*(2+Math.random()*3), rot:Math.random()*TAU, vr:(fromLeft?1:-1)*(0.15+Math.random()*0.4)});
  }
}

function drawSky(st){
  var c=st.clouds, day=st.day, golden=st.golden;
  var ovc = smooth(0,0.35,c);
  var skyTop = mixc(mixc(DAY_SKY_TOP, OVC_SKY_TOP, ovc), NIT_SKY_TOP, 1-day);
  var skyMid = mixc(mixc(DAY_SKY_MID, OVC_SKY_MID, ovc), NIT_SKY_MID, 1-day);
  var skyLow = mixc(mixc(DAY_SKY_LOW, OVC_SKY_LOW, ovc), NIT_SKY_LOW, 1-day);
  skyTop = mixc(skyTop, DUSK_TOP, golden*(1-day*0.2));
  skyMid = mixc(skyMid, DUSK_MID, golden*0.7);
  skyLow = mixc(skyLow, DUSK_LOW, golden*0.55);
  var g = ctx.createLinearGradient(0,0,0,ch*0.66);
  g.addColorStop(0, cstr(skyTop));
  g.addColorStop(0.45, cstr(skyMid));
  g.addColorStop(1, cstr(skyLow));
  ctx.fillStyle = g;
  ctx.fillRect(0,0,cw,ch*0.66);

  if(st.sun.visible){
    var gc = ctx.createRadialGradient(st.sun.x, st.sun.y, 0, st.sun.x, st.sun.y, cw*0.34);
    var glowCol = day>0.5 ? [255,225,150] : (day>0.2 ? [255,170,110] : [180,200,255]);
    gc.addColorStop(0, cstr(glowCol, 0.35*day*golden + (1-day)*0.12));
    gc.addColorStop(1, cstr(glowCol, 0));
    ctx.fillStyle = gc;
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.fillRect(0,0,cw,ch*0.7);
    ctx.restore();
  }

  if(day < 0.4){
    var sa = smooth(0.35,0.05,day);
    ctx.fillStyle = '#cfe0ff';
    for(var i=0;i<stars.length;i++){
      var tw = 0.5+0.5*Math.sin(simT*2+stars[i].p);
      ctx.globalAlpha = sa*(0.35+0.65*tw);
      ctx.fillRect(stars[i].x*cw, stars[i].y*ch, stars[i].r, stars[i].r);
    }
    ctx.globalAlpha = 1;
  }

  if(day < 0.3){
    var moon = projectCel(-st.elev/2 + 0.28, st.az + Math.PI);
    if(moon.visible && moon.y < ch*0.6){
      ctx.save();
      ctx.globalAlpha = smooth(0.3,0.12,day);
      var mg = ctx.createRadialGradient(moon.x,moon.y,0,moon.x,moon.y,cw*0.16);
      mg.addColorStop(0,cstr([205,220,245],0.3));
      mg.addColorStop(1,cstr([205,220,245],0));
      ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(moon.x,moon.y,cw*0.16,0,TAU); ctx.fill();
      ctx.fillStyle = cstr([235,242,252],0.95);
      ctx.beginPath(); ctx.arc(moon.x,moon.y,cw*0.028,0,TAU); ctx.fill();
      ctx.fillStyle = cstr([200,212,232],0.85);
      ctx.beginPath();
      ctx.arc(moon.x-cw*0.009,moon.y-cw*0.006,cw*0.006,0,TAU);
      ctx.arc(moon.x+cw*0.010,moon.y+cw*0.008,cw*0.004,0,TAU);
      ctx.arc(moon.x,moon.y+cw*0.012,cw*0.005,0,TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  if(st.sun.visible && st.elev > -0.05 && st.sun.y < ch*0.62){
    ctx.save();
    ctx.globalAlpha = smooth(0,0.06,st.elev);
    ctx.fillStyle = cstr([255,244,200],1);
    ctx.beginPath(); ctx.arc(st.sun.x, st.sun.y, cw*0.025*(1-st.day*0.25),0,TAU); ctx.fill();
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle = cstr([255,216,120],0.5);
    ctx.beginPath(); ctx.arc(st.sun.x, st.sun.y, cw*0.068,0,TAU); ctx.fill();
    ctx.restore();
  }
  drawClouds(st);
  if(st.fog>0.02) drawFog(st);
}

function drawClouds(st){
  var day = st.day, wind = S.wind;
  var cdt = clamp(simT - cldT, 0, 0.12);
  cldT = simT;
  var baseCol = mixc([255,255,255], [92,102,118], clamp(st.clouds*1.2,0,1));
  var col = mixc(baseCol, [16,26,48], 1-day);
  col = mixc(col, [255,190,140], st.golden*0.5);
  for(var i=0;i<cloudsL.length;i++){
    var cl = cloudsL[i];
    var pxPerSec = (8 + wind*0.9)*(0.65 + 0.5*(1-cl.s));
    cl.x += (pxPerSec/cw)*cdt;
    if(cl.x > 1.4) cl.x = -0.45;
    if(cl.x < -0.5) cl.x = 1.35;
    var cx = cl.x*cw, cy = cl.y*ch;
    var w = cl.s*cw*0.16, h = cl.s*ch*0.045;
    ctx.save();
    ctx.globalAlpha = cl.o*(0.5+0.5*cl.s)*(0.55+0.45*(1-st.clouds*0.3));
    ctx.fillStyle = cstr(col,0.85);
    pCloud(cx,cy,w,h);
    ctx.fill();
    ctx.restore();
  }
}
function pCloud(cx,cy,w,h){
  ctx.beginPath();
  ctx.arc(cx-w*0.22, cy, h*0.7, 0, TAU);
  ctx.arc(cx, cy-h*0.25, h*0.95, 0, TAU);

function silhouetteRow(base, top, n, x0, x1){
  var seg=(x1-x0)/n;
  ctx.beginPath();
  ctx.moveTo(x0,base);
  for(var i=0;i<=n;i++){
    var x=x0+i*seg;
    var h=top+rnd(i*13.7)*(base-top)*0.35;
    ctx.lineTo(x, h);
    ctx.quadraticCurveTo(x+seg*0.5, h-(base-top)*0.4, x+seg, h+rnd(i*7.1)*(base-top)*0.3);
  }
  ctx.lineTo(x1,base);
  ctx.closePath();
}
function drawTree(cx, base, s, sway, day){

  ctx.beginPath(); ctx.arc(r0*0.6, r0*0.3, r0*0.8,0,TAU); ctx.fill();

function drawStar(cx,cy,r){
  ctx.beginPath();
  for(var i=0;i<10;i++){
    var ang = -Math.PI/2 + i*Math.PI/5;
    var rad = (i%2===0) ? r : r*0.4;
    var px = cx + Math.cos(ang)*rad, py = cy + Math.sin(ang)*rad;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fill();
}
function drawUsFlag(x,y,w,wind,ph){
  var h = w/1.9;
  var RED = '#b22234', BLUE = '#3c3b6e', WHITE = '#ffffff';
  var amp = h*0.16*(0.45 + Math.min(1, wind/80));
  var cols = 16;
  function wob(xx, yy){
    var t = clamp((xx-x)/w, 0, 1);
    return yy + Math.sin((xx-x)*0.06 + ph)*amp*t;
  }
  var stripes = 13, sh = h/stripes;
  for(var i=0;i<stripes;i++){
    var y0 = y + i*sh, y1 = y0 + sh;
    ctx.fillStyle = (i%2===0) ? RED : WHITE;
    ctx.beginPath();
    ctx.moveTo(x, wob(x,y0));
    for(var c=1;c<=cols;c++){ var xx = x + w*c/cols; ctx.lineTo(xx, wob(xx,y0)); }
    ctx.lineTo(x+w, wob(x+w,y1));
    for(c=cols;c>=1;c--){ var xx2 = x + w*c/cols; ctx.lineTo(xx2, wob(xx2,y1)); }
    ctx.lineTo(x, wob(x,y1));
    ctx.closePath();
    ctx.fill();
  }
  var cw = w*0.4, chh = h*7/13;
  ctx.fillStyle = BLUE;
  ctx.beginPath();
  ctx.moveTo(x, wob(x,y));
  for(var c=1;c<=cols;c++){ var xx = x + cw*c/cols; ctx.lineTo(xx, wob(xx,y)); }
  ctx.lineTo(x+cw, wob(x+cw,y+chh));
  for(c=cols;c>=1;c--){ var xx2 = x + cw*c/cols; ctx.lineTo(xx2, wob(xx2,y+chh)); }
  ctx.lineTo(x, wob(x,y+chh));
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = WHITE;
  for(var row=0;row<9;row++){
    var n = (row%2===0)?6:5;
    var off = (6-n)/2;
    for(var s=0;s<n;s++){
      var sX = x + cw*(s + off + 0.5)/6;
      var sY = wob(sX, y + chh*(row + 0.5)/9);
      drawStar(sX, sY, h*0.022);
    }
  }
}

function drawWater(st){
  var day = st.day;
  var hor = ch*0.60;
  var wTop = mixc(mixc([90,160,198],[168,206,224],0.35), [14,26,48], 1-day);
  var wBot = mixc(mixc([44,110,160],[30,84,132],0.5), [6,12,26], 1-day);
  wTop = mixc(wTop,[80,92,112],clamp(S.clouds*0.8,0,1)*0.45);
  wBot = mixc(wBot,[48,58,76],clamp(S.clouds*0.8,0,1)*0.4);
  var g = ctx.createLinearGradient(0,hor,0,ch);
  g.addColorStop(0,cstr(wTop));
  g.addColorStop(1,cstr(wBot));
  ctx.fillStyle=g;
  ctx.fillRect(0,hor,cw,ch-hor);

  var rg = ctx.createLinearGradient(0,hor,0,ch);
  var skyRef = mixc([205,232,250],[40,62,96],1-day);
  rg.addColorStop(0, cstr(skyRef, 0.5));
  rg.addColorStop(1, cstr(skyRef, 0.18));
  ctx.fillStyle=rg;
  ctx.fillRect(0,hor,cw,ch-hor);

  if(st.sun.visible && st.day>0.05){
    for(var i=0;i<7;i++){
      var fy = hor + (ch-hor)*i/7;
      var span = cw*(0.02 + 0.10*i/7)*(0.5+st.day);
      ctx.fillStyle = cstr([255,224,150], 0.5 - 0.06*i);
      ctx.fillRect(st.sun.x-span/2, fy, span, 1.8+2.2*i/7);
    }
  }

  var chop = 0.5 + clamp(S.wind/40,0,1)*1.6;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(var r=0;r<12;r++){
    var yy = hor + (ch-hor)*(r+1)/12;
    var alpha = 0.10*(1-r/12*0.8)*(0.4+0.6*st.day);
    if(day<0.25) alpha *= 0.5;
    for(var cIdx=0;cIdx<30;cIdx++){
      var bx = (cIdx + 0.5*Math.sin(simT*1.2 + r*1.7 + cIdx*0.8))*cw/30;
      var wlen = cw/30*(0.6+0.5*chop);

      ctx.globalAlpha = alpha*clamp(ph2,0.25,1);

    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.fillStyle = cstr(mixc([70,150,190],[10,20,40],1-day),1);
  for(var i=0;i<3;i++){
    var fx = ((simT*(0.04+chop*0.03)+i*0.33)%1.4-0.2)*cw;
    var fy = ch*(0.78+i*0.06);
    ctx.beginPath();
    ctx.ellipse(fx, fy, cw*0.2, ch*0.012, 0, 0, TAU);
    ctx.fill();
  }
}

function drawLighthouse(st){
  var day = st.day;
  var x = 0.150*cw, base = 0.60*ch, top = 0.315*ch;
  var wB = mixc([200,196,188],[26,34,50],1-day);
  var rB = mixc([168,36,40],[70,22,22],1-day);

  ctx.fillStyle = cstr(mixc([96,100,106],[18,24,32],1-day),1);
  for(var rk=0;rk<6;rk++){
    var rxx = x - 0.035*cw + rk*0.014*cw;
    var ryy = base + 0.006*ch - Math.abs(rk-2.5)*0.005*ch;
    ctx.beginPath();
    ctx.ellipse(rxx, ryy, 0.013*cw, 0.006*ch, 0, 0, TAU);
    ctx.fill();
  }

  ctx.fillStyle = cstr(mixc([130,138,142],[16,22,34],1-day),1);
  ctx.beginPath();
  ctx.moveTo(x-0.03*cw, base);
  ctx.lineTo(x+0.05*cw, base);
  ctx.lineTo(x+0.04*cw, base+0.08*ch);
  ctx.lineTo(x-0.02*cw, base+0.08*ch);
  ctx.closePath(); ctx.fill();
  for(var i=0;i<4;i++){
    ctx.fillStyle = cstr(mixc([112,120,126],[12,18,28],1-day),1);
    ctx.beginPath(); ctx.ellipse(x-0.02*cw+i*0.018*cw, base+0.03*ch, 0.012*cw, 0.008*ch,0,0,TAU); ctx.fill();
  }

  var tw = 0.020*cw;
  var bandH = (base-top)/7;
  for(var b=0;b<7;b++){
    ctx.fillStyle = cstr(b%2===0 ? wB : rB, 1);
    ctx.fillRect(x-tw/2, top+b*bandH, tw, bandH+1);
  }
  ctx.fillStyle = cstr(mixc([120,124,128],[18,24,34],1-day),1);
  ctx.fillRect(x-tw*0.55, top-0.035*ch, tw*1.1, 0.045*ch);
  ctx.strokeStyle = cstr(mixc([70,74,80],[10,14,22],1-day),1);
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(x-tw*0.9, top-0.045*ch); ctx.lineTo(x+tw*0.9, top-0.045*ch);
  ctx.stroke();
  var gl = day<0.55 ? LAMP : mixc([160,190,220],[40,60,90],1-day);
  ctx.fillStyle = cstr(mixc([90,98,108],[16,22,32],1-day),1);
  ctx.fillRect(x-tw*0.45, top-0.085*ch, tw*0.9, 0.05*ch);
  ctx.fillStyle = cstr(mixc(gl,[255,214,140], day<0.55?0.55:0), 0.98);
  ctx.fillRect(x-tw*0.38, top-0.078*ch, tw*0.76, 0.036*ch);
  ctx.fillStyle = cstr(rB,1);
  ctx.beginPath();
  ctx.moveTo(x-tw*0.55, top-0.082*ch);
  ctx.lineTo(x+tw*0.55, top-0.082*ch);
  ctx.lineTo(x, top-0.135*ch);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = cstr([235,190,70],1);
  ctx.beginPath(); ctx.arc(x, top-0.135*ch, 0.004*cw,0,TAU); ctx.fill();

  if(day<0.55){
    var pX = x, pY = top-0.06*ch;
    var sweep = (simT*0.07) % 1;
    var tX = pX + 0.05*cw + sweep*0.78*cw;
    var tY = base + 0.02*ch;
    var ang = Math.atan2(tY-pY, tX-pX);
    var e = Math.min(sweep, 1-sweep);
    var fade = Math.min(1, e/0.10);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = fade;
    ctx.translate(pX,pY);
    ctx.rotate(ang);
    var bgr = ctx.createLinearGradient(0,0,cw*0.8,0);
    bgr.addColorStop(0, cstr([255,226,150],0.55));
    bgr.addColorStop(1, cstr([255,226,150],0));

function initDucks(){
  ducks = [];

    var x = 0.10*cw + Math.random()*0.80*cw;
    var y = 0.63*ch + Math.random()*0.32*ch;
    var ang = Math.random()*TAU;
    var spd = 0.007*cw + Math.random()*0.010*cw;
    ducks.push({ x:x, y:y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, ph:Math.random()*10, bobF:1.2+Math.random()*0.8, chT: 2+Math.random()*5 });
  }
}
function mgmtDucks(dt){
  for(var i=0;i<ducks.length;i++){
    var d = ducks[i];
    d.chT -= dt;
    if(d.chT<=0){
      var ang = Math.random()*TAU;
      var spd = 0.007*cw + Math.random()*0.010*cw;
      d.vx = Math.cos(ang)*spd;
      d.vy = Math.sin(ang)*spd;
      d.chT = 3+Math.random()*6;
    }
    d.x += d.vx*dt;
    d.y += d.vy*dt;
    var x0=0.03*cw, x1=0.97*cw, y0=0.62*ch, y1=1.03*ch;
    if(d.x<x0){ d.x=x0; d.vx=Math.abs(d.vx); }
    if(d.x>x1){ d.x=x1; d.vx=-Math.abs(d.vx); }
    if(d.y<y0){ d.y=y0; d.vy=Math.abs(d.vy); }
    if(d.y>y1){ d.y=y1; d.vy=-Math.abs(d.vy); }
  }
}

function drawRain(){
  if(S.rain<0.02) return;
  var ang = clamp((S.wind-5)/85,0,1)*0.75-0.15;
  ctx.save();
  ctx.strokeStyle = 'rgba(185,205,225,0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(var i=0;i<raindrops.length;i++){
    var d = raindrops[i];
    var sp = d.sp*(1+S.rain*0.4);
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x - Math.sin(ang)*d.l, d.y + d.l);
  }
  ctx.stroke();
  ctx.restore();
}
function mgmtRain(dt){
  var ang = clamp((S.wind-5)/85,0,1)*0.75-0.15;
  for(var i=0;i<raindrops.length;i++){
    var d = raindrops[i];
    var sp = d.sp*(1+S.rain*0.4);
    d.y += sp*60*dt;
    d.x -= Math.sin(ang)*sp*60*dt*0.6;
    if(d.y > ch){ d.y = -10; d.x = Math.random()*cw; }
    if(d.x > cw+20) d.x = -10;
    if(d.x < -20) d.x = cw+10;

}

function drawFireworks(day){
  if(day>=0.5) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var FWPAL = [[255,120,120],[255,220,120],[150,200,255],[170,255,180],[255,160,240],[255,255,255]];
  var nb = 5;
  for(var fb=0; fb<nb; fb++){
    var t = ((simT/2.6) + fb/nb) % 1;
    var bx = (0.12 + rnd(fb*3.13)*0.76) * cw;
    var by = (0.07 + rnd(fb*7.71)*0.26) * ch;
    var alpha = (t<0.12 ? t/0.12 : (1-(t-0.12)/0.88));
    if(alpha<=0.02) continue;
    var rad = (0.015 + t*0.13)*cw;
    ctx.strokeStyle = cstr(FWPAL[fb%FWPAL.length], alpha*0.3);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(bx, by-0.02*ch); ctx.lineTo(bx, by); ctx.stroke();
    ctx.fillStyle = cstr([255,255,240], alpha*0.5);
    ctx.beginPath(); ctx.arc(bx, by, 0.006*cw*(1-t*0.5), 0, TAU); ctx.fill();
    for(var pi2=0; pi2<28; pi2++){
      var a2 = (pi2/28)*TAU;
      var rr = rad*(0.75+0.25*rnd(fb*5.1+pi2));
      var px = bx + Math.cos(a2)*rr;
      var py = by + Math.sin(a2)*rr + t*t*0.05*ch;
      var col = FWPAL[(fb+pi2)%FWPAL.length];
      ctx.fillStyle = cstr(col, alpha*0.85);
      ctx.beginPath(); ctx.arc(px, py, 0.0018*cw, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}

  var mx2 = (0.05 + simT*0.0125) % 1;
  mickeyAt(mx2*cw, 0.85*ch, simT*3.4, 1);

  ctx.strokeStyle = cstr(branchC,1); ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cw,0); ctx.quadraticCurveTo(cw*0.86, -0.005*ch, cw*0.72, 0.10*ch); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(cw*0.82,0.03*ch); ctx.quadraticCurveTo(cw*0.74,0.02*ch,cw*0.70,0.12*ch); ctx.stroke();
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cw*0.76,0.06*ch); ctx.quadraticCurveTo(cw*0.69,0.08*ch,cw*0.66,0.16*ch); ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.fillStyle = cstr(leafC,0.95);
  var cls = [[cw*0.74,0.055*ch,0.05*cw],[cw*0.70,0.125*ch,0.045*cw],[cw*0.79,0.015*ch,0.04*cw],[cw*0.66,0.185*ch,0.035*cw],[cw*0.85,0.005*ch,0.032*cw]];
  for(var cl2=0;cl2<cls.length;cl2++){
    ctx.beginPath(); ctx.arc(cls[cl2][0], cls[cl2][1], cls[cl2][2], 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = cstr(branchC,1); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(cw*0.06,0.02*ch, cw*0.10,0.11*ch); ctx.stroke();
  ctx.fillStyle = cstr(leafC,0.9);
  ctx.beginPath(); ctx.arc(cw*0.09,0.105*ch,0.03*cw,0,TAU); ctx.fill();

  ctx.strokeStyle = cstr(mixc([40,44,54],[130,140,160],1-day),0.8); ctx.lineWidth = 1.6;
  var btx = (simT*6)% (cw+160) - 80;
  ctx.beginPath(); ctx.moveTo(cw*0.25+btx*0.6, 0.09*ch); ctx.quadraticCurveTo(cw*0.25+btx*0.6+4, 0.09*ch-3.2, cw*0.25+btx*0.6+8, 0.09*ch); ctx.quadraticCurveTo(cw*0.25+btx*0.6+12, 0.09*ch-3.2, cw*0.25+btx*0.6+16, 0.09*ch); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cw*0.32+btx*0.6, 0.13*ch); ctx.quadraticCurveTo(cw*0.32+btx*0.6+3.2, 0.13*ch-2.6, cw*0.32+btx*0.6+6.4, 0.13*ch); ctx.quadraticCurveTo(cw*0.32+btx*0.6+9.6, 0.13*ch-2.6, cw*0.32+btx*0.6+12.8, 0.13*ch); ctx.stroke();

  ctx.restore();
}

function drawBands(st){
  var skyTop = mixc(mixc(DAY_SKY_TOP, OVC_SKY_TOP, smooth(0,0.35,st.clouds)), NIT_SKY_TOP, 1-st.day);
  skyTop = mixc(skyTop, DUSK_TOP, st.golden*(1-st.day*0.2));
  var bot;
  if(scene==='castle'){
    bot = mixc([128,132,138],[15,18,25],1-st.day);
  } else {
    bot = mixc(mixc([44,110,160],[30,84,132],0.5), [6,12,26], 1-st.day);
    bot = mixc(bot,[48,58,76],clamp(S.clouds*0.8,0,1)*0.4);
  }
  ctx.save();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var topH = sceneOY;
  var g1 = ctx.createLinearGradient(0,0,0,topH);
  g1.addColorStop(0, cstr(mixc(skyTop,[0,0,0],0.18)));
  g1.addColorStop(1, cstr(skyTop));
  ctx.fillStyle = g1;
  ctx.fillRect(0,0,viewW,topH);
  var y0 = sceneOY + ch*sceneScale;
  var g2 = ctx.createLinearGradient(0,y0,0,viewH);
  g2.addColorStop(0, cstr(bot));
  g2.addColorStop(1, cstr(mixc(bot,[0,0,0],0.22)));
  ctx.fillStyle = g2;
  ctx.fillRect(0,y0,viewW,viewH-y0);
  ctx.restore();
}

function drawScene(st){
  if(sceneOY > 0.5) drawBands(st);
  ctx.clearRect(0,0,cw,ch);
  drawSky(st);
  if(scene==='castle'){
    drawCastleScene(st);
  }else{
    drawShore(st);
    drawWater(st);
    drawWindowReflections(st.day);
    drawDucks(st);
    drawHotel(st);
    drawTrees(st);
    drawLighthouse(st);
    drawLamps(st);
    ctx.fillStyle = cstr(mixc(TREE_D,[16,26,42],1-st.day),1);
    for(var i=0;i<8;i++){
      var bx = 0.28*cw + i*0.06*cw;
      ctx.beginPath();
      ctx.arc(bx + Math.sin(simT*1.3+i)*S.wind/70*0.003*cw, 0.588*ch, 0.011*cw, 0, TAU);
      ctx.fill();
    }
  }
  drawSnowLayers(st);
  drawRain();
  drawSnow();
  drawLeaves();
  drawVignette();
}

function codeInfo(c){
  if(c===0) return {condition:'Cielo despejado', rain:0, snow:0, clouds:0.1, fog:0};
  if(c===1) return {condition:'Mayormente despejado', rain:0, snow:0, clouds:0.25, fog:0};
  if(c===2) return {condition:'Parcialmente nublado', rain:0, snow:0, clouds:0.45, fog:0};
  if(c===3) return {condition:'Cubierto', rain:0, snow:0, clouds:0.9, fog:0};
  if(c===45||c===48) return {condition:'Niebla', rain:0.05, snow:0, clouds:1, fog:0.6};
  if(c===51||c===53||c===55) return {condition:'Llovizna', rain:0.25, snow:0, clouds:0.92, fog:0.1};
  if(c===56||c===57) return {condition:'Llovizna helada', rain:0.2, snow:0.2, clouds:0.95, fog:0.2};
  if(c===61) return {condition:'Lluvia ligera', rain:0.35, snow:0, clouds:0.9, fog:0};
  if(c===63) return {condition:'Lluvia', rain:0.6, snow:0, clouds:0.95, fog:0};
  if(c===65) return {condition:'Lluvia fuerte', rain:0.9, snow:0, clouds:1, fog:0};
  if(c===66||c===67) return {condition:'Lluvia helada', rain:0.5, snow:0.25, clouds:1, fog:0.1};
  if(c===71) return {condition:'Nevada ligera', rain:0, snow:0.45, clouds:0.92, fog:0.05};
  if(c===73) return {condition:'Nevada', rain:0, snow:0.7, clouds:0.95, fog:0.1};
  if(c===75) return {condition:'Nevada fuerte', rain:0, snow:0.95, clouds:1, fog:0.15};
  if(c===77) return {condition:'Granos de nieve', rain:0, snow:0.5, clouds:0.9, fog:0};
  if(c===80) return {condition:'Chubascos', rain:0.6, snow:0, clouds:0.85, fog:0};
  if(c===81) return {condition:'Chubascos fuertes', rain:0.85, snow:0, clouds:0.9, fog:0};
  if(c===82) return {condition:'Chubasco intenso', rain:1, snow:0, clouds:0.95, fog:0};
  if(c===85) return {condition:'Chubascos de nieve', rain:0, snow:0.75, clouds:0.92, fog:0};
  if(c===86) return {condition:'Chubascos intensos de nieve', rain:0, snow:0.95, clouds:0.95, fog:0};
  if(c>=95) return {condition:'Tormenta', rain:0.95, snow:0, clouds:1, fog:0};
  return {condition:'Cielo despejado', rain:0, snow:0, clouds:0.2, fog:0};
}

function fetchWeather(){
  var url = 'https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+
    '&current=temperature_2m,weather_code,precipitation,rain,snowfall,cloud_cover,wind_speed_10m,wind_direction_10m,is_day'+
    '&timezone=Europe%2FParis&forecast_days=1';
  fetch(url).then(function(r){ return r.json(); }).then(function(j){
    var cur = j.current;
    if(!cur) return;
    var info = codeInfo(cur.weather_code);
    W.temp = Math.round(cur.temperature_2m);
    W.code = cur.weather_code;
    W.condition = info.condition;
    W.clouds = Math.min(1, (cur.cloud_cover/100)*0.85 + info.clouds*0.15);
    W.rain = Math.max(info.rain, Math.min((cur.rain||0)/6,0.9) + Math.min(cur.precipitation||0,6)/12*0.4);
    W.snow = Math.max(info.snow, Math.min((cur.snowfall||0)/4,1));
    W.wind = cur.wind_speed_10m || 8;
    W.windDir = cur.wind_direction_10m || 200;
    W.fog = info.fog || 0;
  }).catch(function(){});
}
function updateHUD(){
  var el = document.getElementById('wTemp');
  var wkmh = Math.round(S.wind);
  var windTxt = wkmh<8 ? 'Calma' : (wkmh<20 ? 'Brisa '+wkmh+' km/h' : (wkmh<40 ? 'Viento '+wkmh+' km/h' : (wkmh<60 ? 'Viento fuerte '+wkmh+' km/h' : 'Galerna '+wkmh+' km/h')));
  el.innerHTML = '<div class="c">'+W.temp+' °C · '+W.condition+'</div><div class="t">'+windTxt+'</div>';
}

function pad2(n){ return n<10 ? '0'+n : ''+n; }
function updateCountdown(){
  var diff = TARGET.getTime() - Date.now();
  var doneEl = document.getElementById('done');
  if(diff <= 0){
    doneEl.style.display = 'flex';
    return;
  }
  document.getElementById('cD').textContent = Math.floor(diff/86400000);
  document.getElementById('cH').textContent = pad2(Math.floor(diff%86400000/3600000));
  document.getElementById('cM').textContent = pad2(Math.floor(diff%3600000/60000));
  document.getElementById('cS').textContent = pad2(Math.floor(diff%60000/1000));
  var opts = {timeZone:'Europe/Paris', hour:'2-digit', minute:'2-digit', second:'2-digit'};
  document.getElementById('clockT').textContent = new Intl.DateTimeFormat('es-ES', opts).format(new Date());
}
setInterval(updateCountdown, 1000);

function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  viewW = window.innerWidth; viewH = window.innerHeight;
  canvas.width = Math.round(viewW*dpr); canvas.height = Math.round(viewH*dpr);
  canvas.style.width = viewW+'px'; canvas.style.height = viewH+'px';
  var s = viewW/DESIGN_W;
  cw = DESIGN_W; ch = DESIGN_H;
  sceneScale = s;
  sceneOX = 0;
  sceneOY = (viewH - ch*s)/2;
  ctx.setTransform(dpr*s, 0, 0, dpr*s, dpr*sceneOX, dpr*sceneOY);
  buildWindows();
  initDucks();
}
window.addEventListener('resize', resize);

var btns = document.querySelectorAll('#panel button');
btns.forEach(function(b){
  b.addEventListener('click', function(){
    btns.forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    mode = b.getAttribute('data-m');
  });
});
document.getElementById('btnSim').addEventListener('click', function(){
  var p = document.getElementById('panel');
  p.hidden = !p.hidden;
  if(!p.hidden){ btns.forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-m')===mode); }); }
});

function applyScene(){
  var isCastle = scene==='castle';
  document.getElementById('tName').textContent = isCastle ? 'Castillo de la Bella Durmiente' : 'Hotel Disney Newport Bay Club';
  document.getElementById('tHint').textContent = isCastle ? 'Cambiar escena · Castillo ⇄ Hotel' : 'Cambiar escena · Hotel ⇄ Castillo';
  document.getElementById('note').textContent = isCastle ? 'Disneyland Paris · Castillo de la Bella Durmiente · 14 nov 2027' : 'Disneyland Paris · Newport Bay Club · 14 nov 2027';
}
document.getElementById('titleBox').addEventListener('click', function(){
  scene = scene==='hotel' ? 'castle' : 'hotel';
  applyScene();
});
applyScene();

var thunderT = 0, thunderFlash = 0;
function frame(now){
  var dt = Math.min(0.05, (now-lastT)/1000);
  lastT = now;
  simT += dt;

  var st = applyMode();
  S.clouds += (st.clouds-S.clouds)*0.05;
  S.rain += (st.rain-S.rain)*0.05;
  S.snow += (st.snow-S.snow)*0.05;
  S.wind += (st.wind-S.wind)*0.05;
  S.fog += (st.fog-S.fog)*0.05;
  curLitAmt = st.day<0.5 ? 1 : (st.rain>0.25||st.clouds>0.7 ? 0.45 : 0.18);
  updateWindows(dt);
  mgmtDucks(dt);

  mgmtParticles();
  mgmtRain(dt);
  mgmtSnow(dt);
  spawnLeaves(dt);
  mgmtLeaves(dt);
  if((mode==='storm') || (mode==='auto' && W.code>=95)){
    thunderT -= dt;
    if(thunderT <= 0){
      thunderFlash = 1;
      thunderT = 2.5 + Math.random()*6;
    }
    thunderFlash = Math.max(0, thunderFlash - dt*4);
  } else {
    thunderFlash = Math.max(0, thunderFlash - dt);
  }

  drawScene(st);

  if(thunderFlash > 0.02){
    ctx.save();
    ctx.fillStyle = 'rgba(240,244,255,'+thunderFlash*0.35+')';
    ctx.fillRect(0,0,cw,ch);
    if(thunderFlash > 0.9) drawLightning();
    ctx.restore();
  }
  updateHUD();
  requestAnimationFrame(frame);
}

function drawLightning(){
  var sx = 0.4*cw + Math.random()*0.2*cw;
  var x = sx, y = 0.05*ch;
  ctx.strokeStyle = 'rgba(255,255,240,0.9)';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x,y);
  while(y < ch*0.60){
    x += (Math.random()-0.5)*0.06*cw;
    y += ch*0.07;
    ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,240,0.7)';
  ctx.beginPath(); ctx.arc(x, y, cw*0.012,0,TAU); ctx.fill();
}

resize();
updateCountdown();
fetchWeather();
setInterval(fetchWeather, 20*60*1000);
requestAnimationFrame(frame);

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}
})();
</script>
