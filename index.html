<style>
  :root{--ink:#eef3fa;--panel:rgba(8,16,32,.55);--edge:rgba(255,255,255,.16);--gold:#ffd98a}
  *{margin:0;padding:0;box-sizing:border-box}

  .unit span{font-size:clamp(9px,1.4vw,12px);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);opacity:.95}
  #cap{bottom:162px;left:50%;transform:translateX(-50%);padding:6px 14px;font-size:clamp(10px,1.5vw,13px);color:rgba(238,243,250,.85);letter-spacing:.1em;white-space:nowrap;border-radius:999px}
  #cap b{color:var(--gold)}

  #btnSim{bottom:22px;right:22px;pointer-events:auto;cursor:pointer;border:none;outline:none;color:var(--ink);font:inherit;font-size:12px;letter-spacing:.08em;padding:9px 12px;border-radius:12px;border:1px solid var(--edge);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #btnSim:hover{background:rgba(255,255,255,.12)}
  #panel{z-index:20;right:22px;bottom:74px;padding:14px;pointer-events:auto}

<script>
(function(){
"use strict";
var TAU = Math.PI*2;
var TARGET = new Date(Date.UTC(2027,10,13,23,0,0));
var LAT = 48.8722, LON = 2.7762;

var canvas = document.getElementById('scene');
var ctx = canvas.getContext('2d');
var cw = 0, ch = 0, dpr = 1;
var DESIGN_W = 1600, DESIGN_H = 900;
var viewW = 0, viewH = 0, sceneScale = 1, sceneOX = 0, sceneOY = 0;
var simT = 0, lastT = performance.now(), cldT = 0;

var mode = 'auto';
var scene = 'hotel';
var W = { temp:14, code:2, clouds:0.25, rain:0, snow:0, wind:10, windDir:200, fog:0, condition:'Cielo despejado' };
var S = { clouds:0.25, rain:0, snow:0, wind:10, fog:0 };

function clamp(x,a,b){ return x<a?a:(x>b?b:x); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smooth(a,b,x){ var t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function mixc(a,b,t){ t=clamp(t,0,1); return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function cstr(c,a){ return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a===undefined?1:a)+')'; }
function rnd(n){ var s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); }

function solar(now){
  var n = (now/86400000) + 2440587.5 - 2451545.0;
  var L0 = ((280.460 + 0.9856474*n) % 360) * Math.PI/180;
  var g  = ((357.528 + 0.9856003*n) % 360) * Math.PI/180;
  var ecl = (23.439 - 0.0000004*n) * Math.PI/180;
  var lambda = L0 + (1.915*Math.sin(g) + 0.020*Math.sin(2*g))*Math.PI/180;
  var dec = Math.asin(Math.sin(ecl)*Math.sin(lambda));
  var ra = Math.atan2(Math.cos(ecl)*Math.sin(lambda), Math.cos(lambda));
  var gmst = (280.46061837 + 360.98564736629*n) * Math.PI/180;
  var lst = gmst + LON*Math.PI/180;
  var ha = ((lst - ra) % TAU);
  if(ha > Math.PI) ha -= TAU;
  if(ha < -Math.PI) ha += TAU;
  var lat = LAT*Math.PI/180;
  var elev = Math.asin(Math.sin(lat)*Math.sin(dec) + Math.cos(lat)*Math.cos(dec)*Math.cos(ha));
  var az = ((Math.atan2(Math.sin(ha), Math.cos(ha)*Math.sin(lat) - Math.tan(dec)*Math.cos(lat)) + Math.PI) % TAU + TAU) % TAU;
  return {elev:elev, az:az};
}

function projectCel(elev, az){
  var reldir = Math.sin(az - Math.PI);
  var x = cw*0.5 + reldir*cw*0.42;
  var y = ch*0.60 - Math.tan(elev)*cw*0.46;
  return {x:x, y:y, visible: reldir > -1.15 && reldir < 1.15};
}

function sunState(now){
  var so = solar(now);
  var day = smooth(-0.12, 0.08, so.elev);
  var golden = clamp(smooth(0.30, 0.02, so.elev) - smooth(0.02, -0.28, so.elev), 0, 1)*0.9;
  return {sun:projectCel(so.elev, so.az), elev:so.elev, az:so.az, day:day, golden:golden};
}

function applyMode(){
  var st = sunState(new Date());
  var d=st.day, cl=W.clouds, r=W.rain, so=W.snow, w=W.wind, fg=W.fog;
  if(mode==='day'){ d=1; cl=0.22; r=0; so=0; w=12; fg=0; }
  else if(mode==='night'){ d=0; cl=0.18; r=0; so=0; w=8; fg=0; }
  else if(mode==='dusk'){ d=0.5; cl=0.3; r=0; so=0; w=8; fg=0.1; }
  else if(mode==='rain'){ d=0.72; cl=0.97; r=0.8; so=0; w=34; fg=0.15; }
  else if(mode==='snow'){ d=0.5; cl=0.88; r=0; so=0.85; w=18; fg=0.25; }
  else if(mode==='storm'){ d=0.35; cl=1; r=0.95; so=0; w=62; fg=0.2; }
  else if(mode==='wind'){ d=0.78; cl=0.5; r=0; so=0; w=72; fg=0; }
  // En los modos simulados el sol y la luz dorada no dependen de la hora real
  if(mode==='dusk'){
    st.golden = 0.85; st.elev = 0.06;
    st.sun = {x:0.80*cw, y:0.40*ch, visible:true};
  } else if(mode!=='auto'){
    st.golden = 0;
    if(mode==='day' && st.elev < 0.15){
      st.elev = 0.6;
      st.sun = {x:0.72*cw, y:0.13*ch, visible:true};
    }
  }
  st.day=d; st.clouds=cl; st.rain=r; st.snow=so; st.wind=w; st.fog=fg;
  return st;
}

var windows = [];
function buildWindows(){
  windows = [];
  var wallL = 0.26*cw, wallR = 0.74*cw;
  var cols = 12, rows = 4;
  var gap = (wallR-wallL)/cols;
  var ww = gap*0.42, wh = 0.031*ch;
  var rowYs = [0.282,0.334,0.386,0.438];
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      var x = wallL + c*gap + (gap-ww)/2;
      windows.push({x:x, y:rowYs[r]*ch - wh/2, w:ww, h:wh, on: rnd(c*31.7+r*17.3) > 0.45, pass: rnd(c+r*5.3), lit: Math.random() < 0.3, ch: 3+Math.random()*14, aw: r>=2});
    }
  }
  var wingRects = [[0,0.26*cw],[0.74*cw,cw]];
  var wingRows = [0.30,0.34,0.38,0.42];
  var whW = 0.028*ch;
  for(var wn=0;wn<2;wn++){
    var x0=wingRects[wn][0], x1=wingRects[wn][1];
    var wc=8, wg=(x1-x0)/wc, wwW=wg*0.42;
    for(var c=0;c<wc;c++){
      for(var r=0;r<4;r++){
        var x = x0 + c*wg + (wg-wwW)/2;
        windows.push({x:x, y:wingRows[r]*ch - whW/2, w:wwW, h:whW, on:true, pass:rnd(c*3.1+r*7.7), lit: Math.random() < 0.3, ch: 3+Math.random()*14, aw: r===3});
      }
    }
  }
}

var DAY_SKY_TOP=[64,150,226], DAY_SKY_MID=[130,196,242], DAY_SKY_LOW=[205,232,250];
var OVC_SKY_TOP=[102,112,130], OVC_SKY_MID=[135,146,162], OVC_SKY_LOW=[176,188,200];
var NIT_SKY_TOP=[5,11,26], NIT_SKY_MID=[16,30,60], NIT_SKY_LOW=[40,62,96];
var DUSK_TOP=[108,121,165], DUSK_MID=[158,132,172], DUSK_LOW=[226,166,128];
var WALL=[232,224,206], WALL_SH=[206,196,176], TRIM=[244,241,232];
var ROOF=[60,92,116], ROOF_D=[38,64,86], SHUT=[40,60,78];
var NAVY=[30,44,66];
var GLASS_DAY=[150,190,226], GLASS_DRK=[104,130,160];
var LAMP=[255,213,138], LAMP_GLOW=[255,190,90];
var GOLD=[255,190,45], GOLD_GLOW=[255,170,30];
var TREE=[70,128,84], TREE_D=[45,92,60], TREE_L=[98,156,104], PINE=[52,96,70];

var raindrops=[], snowflakes=[], leaves=[];
var stars=[];
(function(){
  for(var i=0;i<230;i++){
    var m = Math.random();
    stars.push({x:Math.random(), y:Math.pow(Math.random(),1.3)*0.56, r:0.5+m*m*1.5, p:Math.random()*TAU, f:1.2+Math.random()*2.4, c:Math.floor(Math.random()*5)});
  }
})();
var STAR_COL = [[255,255,255],[214,228,255],[255,244,220],[255,226,196],[196,214,255]];
var cloudsL=[];
// Cada nube guarda sus lóbulos (en unidades de ancho/alto) para tener forma propia
function makeCloud(kind){
  var cl = {x:Math.random()*1.7-0.35, kind:kind, o:0.5+Math.random()*0.5, lobes:[]};
  if(kind===1){ cl.y = 0.30+Math.random()*0.15; cl.s = 0.32+Math.random()*0.3; }
  else if(kind===2){ cl.y = 0.03+Math.random()*0.26; cl.s = 1.3+Math.random()*1.2; }
  else { cl.y = 0.05+Math.random()*0.26; cl.s = 0.7+Math.random()*1.4; }
  var n = 6+Math.floor(Math.random()*3);
  for(var j=0;j<n;j++){
    var t = j/(n-1), arc = Math.sin(Math.PI*t);
    cl.lobes.push({dx:(t-0.5)*0.86+(Math.random()-0.5)*0.05, dy:-arc*0.30-Math.random()*0.12, r:(0.46+0.44*arc)*(0.8+Math.random()*0.35)});
  }
  for(var k=0;k<3;k++){
    cl.lobes.push({dx:(Math.random()-0.5)*0.42, dy:-0.62-Math.random()*0.34, r:0.48+Math.random()*0.26});
  }
  return cl;
}
(function(){
  var i;
  for(i=0;i<5;i++) cloudsL.push(makeCloud(1));
  for(i=0;i<6;i++) cloudsL.push(makeCloud(0));
  for(i=0;i<6;i++) cloudsL.push(makeCloud(2));
})();
var cirrus=[];
(function(){
  for(var i=0;i<5;i++) cirrus.push({x:Math.random(), y:0.03+Math.random()*0.16, w:0.16+Math.random()*0.2, a:-0.12+Math.random()*0.1, o:0.4+Math.random()*0.6});
})();

var curLitAmt = 0.18;
function updateWindows(dt){
  var p = clamp(curLitAmt*0.92, 0.05, 0.98);
  for(var i=0;i<windows.length;i++){
    var wp = windows[i];
    if(simT < wp.ch) continue;
    wp.lit = Math.random() < p;
    wp.ch = simT + (wp.lit ? 20+Math.random()*45 : 8+Math.random()*24);
  }
}
function mgmtParticles(){
  var targetRain = clamp(S.rain,0,1)*cw*0.5;
  while(raindrops.length < targetRain && raindrops.length<900){
    raindrops.push({x:Math.random()*cw, y:Math.random()*ch, sp:cw*0.02*(0.75+Math.random()*0.6), l:ch*0.03*(0.6+Math.random()*0.5)});
  }
  if(raindrops.length > targetRain) raindrops.length = Math.floor(targetRain);
  var targetSnow = clamp(S.snow,0,1)*cw*0.35;
  while(snowflakes.length < targetSnow && snowflakes.length<700){
    snowflakes.push({x:Math.random()*cw, y:Math.random()*ch, r:1.2+Math.random()*2.6*(0.6+S.snow), vy:cw*0.006*(0.5+Math.random()*0.7), p:Math.random()*TAU});
  }
  if(snowflakes.length > targetSnow) snowflakes.length = Math.floor(targetSnow);
}

function spawnLeaves(dt){
  var rate = clamp((S.wind-22)/55,0,1);
  if(leaves.length<60 && Math.random() < rate*dt*30){
    var fromLeft = Math.random()<0.5;
    var spd = cw*(0.25+Math.random()*0.35)*(0.5+S.wind*0.012);
    leaves.push({x:fromLeft?-30:cw+30, y:0.1*ch+Math.random()*0.5*ch, vx:(fromLeft?1:-1)*spd, vy:cw*0.012*(2+Math.random()*3), rot:Math.random()*TAU, vr:(fromLeft?1:-1)*(0.15+Math.random()*0.4)});
  }
}

function drawSky(st){
  var c=st.clouds, day=st.day, golden=st.golden;
  var ovc = smooth(0,0.35,c);
  var skyTop = mixc(mixc(DAY_SKY_TOP, OVC_SKY_TOP, ovc), NIT_SKY_TOP, 1-day);
  var skyMid = mixc(mixc(DAY_SKY_MID, OVC_SKY_MID, ovc), NIT_SKY_MID, 1-day);
  var skyLow = mixc(mixc(DAY_SKY_LOW, OVC_SKY_LOW, ovc), NIT_SKY_LOW, 1-day);
  skyTop = mixc(skyTop, DUSK_TOP, golden*(1-day*0.2));
  skyMid = mixc(skyMid, DUSK_MID, golden*0.7);
  skyLow = mixc(skyLow, DUSK_LOW, golden*0.55);
  var g = ctx.createLinearGradient(0,0,0,ch*0.66);
  g.addColorStop(0, cstr(mixc(skyTop,[0,0,0],0.12)));
  g.addColorStop(0.18, cstr(skyTop));
  g.addColorStop(0.55, cstr(skyMid));
  g.addColorStop(1, cstr(skyLow));
  ctx.fillStyle = g;
  ctx.fillRect(0,0,cw,ch*0.66);

  // Calima del horizonte
  var hz = ctx.createLinearGradient(0,ch*0.36,0,ch*0.64);
  var hzc = mixc(mixc([255,250,238],[255,196,150],golden), [70,92,132], 1-day);
  hz.addColorStop(0, cstr(hzc,0));
  hz.addColorStop(1, cstr(hzc,0.30*(1-ovc*0.6)));
  ctx.fillStyle = hz;
  ctx.fillRect(0,ch*0.36,cw,ch*0.30);

  if(st.sun.visible){
    var gc = ctx.createRadialGradient(st.sun.x, st.sun.y, 0, st.sun.x, st.sun.y, cw*0.34);
    var glowCol = day>0.5 ? [255,225,150] : (day>0.2 ? [255,170,110] : [180,200,255]);
    gc.addColorStop(0, cstr(glowCol, 0.35*day*golden + (1-day)*0.12));
    gc.addColorStop(1, cstr(glowCol, 0));
    ctx.fillStyle = gc;
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.fillRect(0,0,cw,ch*0.7);
    ctx.restore();
  }

  if(day < 0.4){
    var sa = smooth(0.35,0.05,day)*(1-clamp(S.clouds,0,1)*0.85);
    // Vía Láctea
    ctx.save();
    ctx.translate(cw*0.55, ch*0.16); ctx.rotate(-0.38);
    var mw = ctx.createLinearGradient(0,-ch*0.11,0,ch*0.11);
    mw.addColorStop(0, cstr([150,170,230],0));
    mw.addColorStop(0.5, cstr([170,186,236],0.11*sa));
    mw.addColorStop(1, cstr([150,170,230],0));
    ctx.fillStyle = mw;
    ctx.fillRect(-cw*0.8,-ch*0.11,cw*1.6,ch*0.22);
    ctx.restore();
    for(var i=0;i<stars.length;i++){
      var sp = stars[i];
      var tw = 0.5+0.5*Math.sin(simT*sp.f+sp.p);
      var hf = 1-smooth(0.34,0.56,sp.y);
      ctx.globalAlpha = sa*hf*(0.35+0.65*tw);
      ctx.fillStyle = cstr(STAR_COL[sp.c]);
      var sx = sp.x*cw, sy = sp.y*ch;
      ctx.beginPath(); ctx.arc(sx, sy, sp.r, 0, TAU); ctx.fill();
      if(sp.r>1.75){
        ctx.globalAlpha = sa*hf*0.5*tw;
        ctx.fillRect(sx-sp.r*3, sy-0.4, sp.r*6, 0.8);
        ctx.fillRect(sx-0.4, sy-sp.r*3, 0.8, sp.r*6);
      }
    }
    ctx.globalAlpha = 1;
    // Estrella fugaz ocasional
    var fk = Math.floor(simT/11), ft = (simT%11)/0.9;
    if(ft<1 && sa>0.4 && rnd(fk*3.3)>0.35){
      var fdir = rnd(fk*1.7)>0.5 ? 1 : -1;
      var fx0 = (0.2+rnd(fk*5.1)*0.6)*cw, fy0 = (0.04+rnd(fk*9.7)*0.2)*ch;
      var fhx = fx0 + fdir*ft*0.22*cw, fhy = fy0 + ft*0.10*ch;
      var ftx = fhx - fdir*0.07*cw*Math.min(1,ft*3), fty = fhy - 0.032*ch*Math.min(1,ft*3);
      var fg = ctx.createLinearGradient(ftx,fty,fhx,fhy);
      fg.addColorStop(0, cstr([255,255,255],0));
      fg.addColorStop(1, cstr([255,255,255],0.9*sa*(1-ft*ft)));
      ctx.strokeStyle = fg; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ftx,fty); ctx.lineTo(fhx,fhy); ctx.stroke();
      ctx.lineCap = 'butt';
    }
  }

  if(day < 0.3){
    var moon = projectCel(-st.elev/2 + 0.28, st.az + Math.PI);
    if(moon.visible && moon.y < ch*0.6){
      var mr = cw*0.028;
      ctx.save();
      ctx.globalAlpha = smooth(0.3,0.12,day);
      var mg = ctx.createRadialGradient(moon.x,moon.y,mr*0.8,moon.x,moon.y,cw*0.17);
      mg.addColorStop(0,cstr([205,220,245],0.34));
      mg.addColorStop(0.3,cstr([205,220,245],0.10));
      mg.addColorStop(1,cstr([205,220,245],0));
      ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(moon.x,moon.y,cw*0.17,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(moon.x,moon.y,mr,0,TAU); ctx.clip();
      var md = ctx.createRadialGradient(moon.x-mr*0.35,moon.y-mr*0.35,mr*0.1,moon.x,moon.y,mr*1.1);
      md.addColorStop(0,cstr([250,252,255])); md.addColorStop(1,cstr([212,222,240]));
      ctx.fillStyle = md;
      ctx.fillRect(moon.x-mr,moon.y-mr,mr*2,mr*2);
      ctx.fillStyle = cstr([176,190,214],0.55);
      var MAR = [[-0.32,-0.22,0.26],[0.36,0.28,0.17],[0.02,0.44,0.20],[0.28,-0.30,0.13],[-0.42,0.26,0.12],[-0.05,-0.05,0.10]];
      for(var mi=0;mi<MAR.length;mi++){
        ctx.beginPath(); ctx.arc(moon.x+MAR[mi][0]*mr, moon.y+MAR[mi][1]*mr, MAR[mi][2]*mr, 0, TAU); ctx.fill();
      }
      // Lado en sombra
      ctx.fillStyle = cstr(NIT_SKY_MID,0.5);
      ctx.beginPath(); ctx.arc(moon.x+mr*0.62, moon.y-mr*0.18, mr*1.02, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }

  if(st.sun.visible && st.elev > -0.05 && st.sun.y < ch*0.62){
    ctx.save();
    ctx.globalAlpha = smooth(0,0.06,st.elev)*smooth(0.12,0.4,st.day);
    ctx.fillStyle = cstr(mixc([255,248,214],[255,190,120],golden),1);
    ctx.beginPath(); ctx.arc(st.sun.x, st.sun.y, cw*0.025*(1-st.day*0.25),0,TAU); ctx.fill();
    ctx.globalCompositeOperation='lighter';
    var sh = ctx.createRadialGradient(st.sun.x, st.sun.y, cw*0.012, st.sun.x, st.sun.y, cw*0.085);
    sh.addColorStop(0, cstr([255,216,120],0.6));
    sh.addColorStop(0.4, cstr([255,216,120],0.18));
    sh.addColorStop(1, cstr([255,216,120],0));
    ctx.fillStyle = sh;
    ctx.beginPath(); ctx.arc(st.sun.x, st.sun.y, cw*0.085,0,TAU); ctx.fill();
    ctx.restore();
  }
  drawClouds(st);
  if(st.fog>0.02) drawFog(st);
}

function drawClouds(st){
  var day = st.day, wind = S.wind, golden = st.golden;
  var cdt = clamp(simT - cldT, 0, 0.12);
  cldT = simT;
  var ovc = clamp(st.clouds*1.2,0,1), wet = clamp(S.rain,0,1)*0.55;
  var light = mixc(mixc([255,255,255],[158,166,180],ovc),[96,102,116],wet);
  var shade = mixc(mixc([182,198,222],[88,98,116],ovc),[52,58,72],wet);
  light = mixc(light,[58,68,98],1-day);
  shade = mixc(shade,[14,22,42],1-day);
  light = mixc(light,[255,216,178],golden*0.6);
  shade = mixc(shade,[198,126,136],golden*0.6);
  var deck = smooth(0.4,0.8,S.clouds);

  // Cirros altos
  var ca = (1-deck)*(0.35+0.4*day);
  if(ca>0.02){
    for(var ci=0;ci<cirrus.length;ci++){
      var cr = cirrus[ci];
      cr.x += ((3+wind*0.25)/cw)*cdt;
      if(cr.x > 1.3) cr.x = -0.3;
      ctx.save();
      ctx.translate(cr.x*cw, cr.y*ch); ctx.rotate(cr.a);
      ctx.fillStyle = cstr(light, ca*cr.o*0.32);
      for(var cs=0;cs<4;cs++){
        ctx.beginPath();
        ctx.ellipse((cs-1.5)*cr.w*cw*0.2, cs*0.008*ch, cr.w*cw*(0.5-cs*0.06), ch*0.0045, 0, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  for(var i=0;i<cloudsL.length;i++){
    var cl = cloudsL[i];
    var pxPerSec = (8 + wind*0.9)*(cl.kind===1 ? 0.3 : 0.65 + 0.5*(1-Math.min(1,cl.s/2)));
    cl.x += (pxPerSec/cw)*cdt;
    if(cl.x > 1.4) cl.x = -0.45;
    if(cl.x < -0.5) cl.x = 1.35;
    var al = cl.kind===1 ? 0.6 : (cl.kind===2 ? deck : 0.8+0.2*cl.o);
    if(al<0.03) continue;
    var cx = cl.x*cw, cy = cl.y*ch;
    var w = cl.s*cw*0.17, h = cl.s*ch*0.05;
    if(cx+w < 0 || cx-w > cw) continue;
    var baseY = cy + h*0.42;
    var j, lb;
    ctx.save();
    ctx.globalAlpha = al;
    ctx.beginPath(); ctx.rect(cx-w, cy-h*2.2, w*2, baseY-(cy-h*2.2)); ctx.clip();
    // cuerpo con degradado: cima iluminada, base en sombra
    var cg = ctx.createLinearGradient(0, cy-h*1.5, 0, baseY);
    cg.addColorStop(0, cstr(light));
    cg.addColorStop(0.55, cstr(mixc(light,shade,0.35)));
    cg.addColorStop(1, cstr(shade));
    ctx.fillStyle = cg;
    ctx.beginPath();
    for(j=0;j<cl.lobes.length;j++){
      lb = cl.lobes[j];
      ctx.moveTo(cx+lb.dx*w+lb.r*h, cy+lb.dy*h);
      ctx.arc(cx+lb.dx*w, cy+lb.dy*h, lb.r*h, 0, TAU);
    }
    ctx.moveTo(cx+w*0.46, cy+h*0.1);
    ctx.ellipse(cx, cy+h*0.1, w*0.46, h*0.42, 0, 0, TAU);
    ctx.fill();
    // volumen: sombra bajo cada lóbulo y brillo en la cima
    ctx.fillStyle = cstr(shade,0.13);
    ctx.beginPath();
    for(j=0;j<cl.lobes.length;j++){
      lb = cl.lobes[j];
      ctx.moveTo(cx+lb.dx*w+lb.r*h*0.2+lb.r*h*0.75, cy+lb.dy*h+lb.r*h*0.45);
      ctx.arc(cx+lb.dx*w+lb.r*h*0.2, cy+lb.dy*h+lb.r*h*0.45, lb.r*h*0.75, 0, TAU);
    }
    ctx.fill();
    ctx.fillStyle = cstr(mixc(light,[255,255,255],0.5*day),0.26);
    ctx.beginPath();
    for(j=0;j<cl.lobes.length;j++){
      lb = cl.lobes[j];
      ctx.moveTo(cx+lb.dx*w-lb.r*h*0.18+lb.r*h*0.55, cy+lb.dy*h-lb.r*h*0.28);
      ctx.arc(cx+lb.dx*w-lb.r*h*0.18, cy+lb.dy*h-lb.r*h*0.28, lb.r*h*0.55, 0, TAU);
    }
    ctx.fill();
    ctx.restore();
  }

  // Capa cubierta: oscurece la parte alta del cielo
  if(deck>0.02){
    var dg = ctx.createLinearGradient(0,0,0,ch*0.5);
    dg.addColorStop(0, cstr(shade,0.55*deck));
    dg.addColorStop(1, cstr(shade,0));
    ctx.fillStyle = dg;
    ctx.fillRect(0,0,cw,ch*0.5);
  }
}
function drawFog(st){
  var g = ctx.createLinearGradient(0,ch*0.42,0,ch*0.78);
  var col = mixc([226,232,238],[40,52,78],1-st.day);
  g.addColorStop(0, cstr(col,0));
  g.addColorStop(1, cstr(col,0.55));
  ctx.fillStyle=g;
  ctx.fillRect(0,ch*0.42,cw,ch*0.36);
}

function drawShore(st){
  var day = st.day;
  var far = mixc([120,166,120],[26,40,62],1-day);
  ctx.fillStyle = cstr(far,1);
  silhouetteRow(ch*0.50, ch*0.535, 26, 0, cw);
  var g = ctx.createLinearGradient(0,ch*0.50,0,ch*0.58);
  g.addColorStop(0, cstr(mixc([84,132,88],[12,22,36],1-day)));
  g.addColorStop(1, cstr(mixc([118,170,104],[18,30,46],1-day)));
  ctx.fillStyle = g;
  ctx.fillRect(0, ch*0.50, cw, ch*0.082);
  // Sendero de la escalinata y paseo del lago
  var sand = mixc([214,198,168],[30,36,50],1-day);
  ctx.fillStyle = cstr(sand,1);
  ctx.beginPath();
  ctx.moveTo(0.445*cw, 0.582*ch); ctx.lineTo(0.555*cw, 0.582*ch);
  ctx.lineTo(0.575*cw, 0.60*ch); ctx.lineTo(0.425*cw, 0.60*ch);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(0, ch*0.580, cw, ch*0.018);
  ctx.strokeStyle = cstr(mixc([176,158,128],[20,26,38],1-day),0.7); ctx.lineWidth = 1;
  ctx.beginPath();
  for(var i=0; i<80; i++){ ctx.moveTo(i/80*cw, ch*0.580); ctx.lineTo(i/80*cw - 0.004*cw, ch*0.598); }
  ctx.stroke();
  ctx.fillStyle = cstr(mixc([120,112,100],[14,18,28],1-day),1);
  ctx.fillRect(0, ch*0.598, cw, ch*0.007);
  // Barandilla
  ctx.strokeStyle = cstr(mixc(TRIM,[70,78,96],1-day),0.95); ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(0, ch*0.586); ctx.lineTo(cw, ch*0.586);
  for(var j=0; j<=50; j++){ ctx.moveTo(j/50*cw, ch*0.586); ctx.lineTo(j/50*cw, ch*0.599); }
  ctx.stroke();
}
function silhouetteRow(base, top, n, x0, x1){
  var seg=(x1-x0)/n;
  ctx.beginPath();
  ctx.moveTo(x0,base);
  for(var i=0;i<=n;i++){
    var x=x0+i*seg;
    var h=top+rnd(i*13.7)*(base-top)*0.35;
    ctx.lineTo(x, h);
    ctx.quadraticCurveTo(x+seg*0.5, h-(base-top)*0.4, x+seg, h+rnd(i*7.1)*(base-top)*0.3);
  }
  ctx.lineTo(x1,base);
  ctx.closePath();
}
function drawTree(cx, base, s, sway, day){
  var sw = Math.sin(simT*1.4 + cx*0.01)*sway;
  var n = 1-day*0.85;
  var bark = mixc([110,82,60],[26,20,18],1-day), barkD = mixc([72,52,40],[14,11,11],1-day);
  var cD = mixc(TREE_D,[14,24,40],n), cM = mixc(TREE,[20,34,54],n), cL = mixc(TREE_L,[26,40,60],n);
  var cH = mixc([146,194,124],[36,52,72],n);
  var top = base - s*0.8, R = s*0.37;
  var kx = cx + sw, ky = top - R*0.05;
  ctx.fillStyle = cstr([0,0,0],0.16);
  ctx.beginPath(); ctx.ellipse(cx, base, s*0.30, s*0.035, 0, 0, TAU); ctx.fill();
  // tronco y ramas
  var tw = Math.max(2.5, s*0.075);
  ctx.fillStyle = cstr(bark,1);
  ctx.beginPath();
  ctx.moveTo(cx-tw*0.95, base);
  ctx.quadraticCurveTo(cx-tw*0.42, base-s*0.22, kx-tw*0.36, ky+R*0.2);
  ctx.lineTo(kx+tw*0.36, ky+R*0.2);
  ctx.quadraticCurveTo(cx+tw*0.42, base-s*0.22, cx+tw*0.95, base);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = cstr(barkD,0.6);
  ctx.beginPath();
  ctx.moveTo(cx+tw*0.2, base);
  ctx.quadraticCurveTo(cx+tw*0.1, base-s*0.22, kx+tw*0.05, ky+R*0.2);
  ctx.lineTo(kx+tw*0.36, ky+R*0.2);
  ctx.quadraticCurveTo(cx+tw*0.42, base-s*0.22, cx+tw*0.95, base);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = cstr(bark,1); ctx.lineWidth = tw*0.42; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx+sw*0.5, base-s*0.36); ctx.lineTo(kx-R*0.45, ky+R*0.25);
  ctx.moveTo(cx+sw*0.6, base-s*0.42); ctx.lineTo(kx+R*0.48, ky+R*0.18);
  ctx.stroke();
  ctx.lineCap = 'butt';
  // copa en tres capas de follaje
  var k, a, wob;
  ctx.fillStyle = cstr(cD,1);
  ctx.beginPath();
  for(k=0;k<8;k++){
    a = k/8*TAU + rnd(cx+k)*0.5; wob = Math.sin(simT*1.8+k+cx)*sway*0.25;
    var bx = kx + Math.cos(a)*R*0.6 + wob, by = ky + Math.sin(a)*R*0.46 + R*0.1, br = R*(0.44+rnd(cx*1.3+k)*0.14);
    ctx.moveTo(bx+br, by); ctx.arc(bx, by, br, 0, TAU);
  }
  ctx.moveTo(kx+R*0.6, ky); ctx.arc(kx, ky, R*0.6, 0, TAU);
  ctx.fill();
  ctx.fillStyle = cstr(cM,1);
  ctx.beginPath();
  for(k=0;k<7;k++){
    a = k/7*TAU + rnd(cx*2+k)*0.6; wob = Math.sin(simT*2.0+k*1.7+cx)*sway*0.3;
    var mx = kx - R*0.07 + Math.cos(a)*R*0.46 + wob, my = ky - R*0.12 + Math.sin(a)*R*0.36, mr = R*(0.36+rnd(cx*1.7+k)*0.12);
    ctx.moveTo(mx+mr, my); ctx.arc(mx, my, mr, 0, TAU);
  }
  ctx.fill();
  ctx.fillStyle = cstr(cL,0.9);
  ctx.beginPath();
  for(k=0;k<5;k++){
    a = k/5*TAU + rnd(cx*3+k); wob = Math.sin(simT*2.3+k*2.1+cx)*sway*0.35;
    var lx = kx - R*0.24 + Math.cos(a)*R*0.3 + wob, ly = ky - R*0.3 + Math.sin(a)*R*0.24, lr = R*(0.22+rnd(cx*2.3+k)*0.1);
    ctx.moveTo(lx+lr, ly); ctx.arc(lx, ly, lr, 0, TAU);
  }
  ctx.fill();
  ctx.fillStyle = cstr(cH,0.75);
  ctx.beginPath();
  for(k=0;k<9;k++){
    var hx = kx - R*0.3 + (rnd(cx*5+k)-0.5)*R*1.1, hy = ky - R*0.42 + (rnd(cx*7+k)-0.5)*R*0.8;
    ctx.moveTo(hx+R*0.07, hy); ctx.arc(hx, hy, R*0.07, 0, TAU);
  }
  ctx.fill();
  if(S.snow>0.25){
    ctx.fillStyle = cstr([255,255,255],(S.snow-0.25)/0.75*0.85);
    ctx.beginPath();
    ctx.ellipse(kx-R*0.1, ky-R*0.62, R*0.62, R*0.2, 0, 0, TAU);
    ctx.ellipse(kx-R*0.55, ky-R*0.25, R*0.3, R*0.12, 0, 0, TAU);
    ctx.ellipse(kx+R*0.5, ky-R*0.3, R*0.3, R*0.12, 0, 0, TAU);
    ctx.fill();
  }
}
function drawPine(cx,base,s,sway,day){
  var sw = Math.sin(simT*1.2+cx)*sway;
  ctx.fillStyle = cstr([0,0,0],0.16);
  ctx.beginPath(); ctx.ellipse(cx, base, s*0.26, s*0.03, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = cstr(mixc([84,60,44],[20,16,18],1-day),1);
  ctx.fillRect(cx-s*0.035, base-s*0.3, s*0.07, s*0.3);
  var col = mixc(PINE,[18,30,46],1-day), colD = mixc([34,70,52],[10,18,30],1-day), colL = mixc([84,132,96],[26,40,58],1-day);
  var tiers = 6, snowA = S.snow>0.25 ? (S.snow-0.25)/0.75*0.9 : 0;
  for(var i=0;i<tiers;i++){
    var t = i/(tiers-1);
    var y = base - s*(0.16 + t*0.78);
    var w = s*(0.36 - t*0.27), hgt = s*(0.30 - t*0.08);
    var off = sw*(0.2 + 0.8*t);
    // faldón dentado
    ctx.fillStyle = cstr(col,1);
    ctx.beginPath();
    ctx.moveTo(cx+off*1.1, y-hgt);
    ctx.lineTo(cx+w+off, y);
    for(var z=1;z<=5;z++){
      var zx = cx + w - (z/5)*w*2 + off;
      ctx.lineTo(zx + w*0.2, y - hgt*0.16);
      ctx.lineTo(zx, y + (z%2 ? hgt*0.04 : 0));
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = cstr(colD,0.7);
    ctx.beginPath();
    ctx.moveTo(cx+off*1.1, y-hgt); ctx.lineTo(cx+w+off, y); ctx.lineTo(cx+w*0.15+off, y-hgt*0.14);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = cstr(colL,0.55);
    ctx.beginPath();
    ctx.moveTo(cx+off*1.1, y-hgt); ctx.lineTo(cx-w*0.75+off, y-hgt*0.12); ctx.lineTo(cx-w*0.3+off, y-hgt*0.2);
    ctx.closePath(); ctx.fill();
    if(snowA>0){
      ctx.fillStyle = cstr([255,255,255],snowA);
      ctx.beginPath();
      ctx.moveTo(cx+off*1.1, y-hgt); ctx.lineTo(cx+w*0.55+off, y-hgt*0.4); ctx.lineTo(cx+w*0.2+off, y-hgt*0.5);
      ctx.lineTo(cx+off, y-hgt*0.36); ctx.lineTo(cx-w*0.25+off, y-hgt*0.5); ctx.lineTo(cx-w*0.55+off, y-hgt*0.4);
      ctx.closePath(); ctx.fill();
    }
  }
}
// Arbusto redondeado en tres tonos
function drawBush(cx, cy, r, day){
  var n = 1-day*0.85;
  ctx.fillStyle = cstr(mixc(TREE_D,[14,24,40],n),1);
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
  ctx.fillStyle = cstr(mixc(TREE,[20,34,54],n),1);
  ctx.beginPath(); ctx.arc(cx-r*0.14, cy-r*0.18, r*0.78, 0, TAU); ctx.fill();
  ctx.fillStyle = cstr(mixc(TREE_L,[26,40,60],n),0.85);
  ctx.beginPath(); ctx.arc(cx-r*0.3, cy-r*0.38, r*0.4, 0, TAU); ctx.fill();
}
// Matas de hierba repartidas por una franja de césped
function drawGrassTufts(x0, x1, y0, y1, count, day, seed){
  var lean = Math.sin(simT*1.6)*S.wind/60*0.004*cw + S.wind/60*0.002*cw;
  for(var p=0;p<2;p++){
    ctx.strokeStyle = cstr(mixc(p ? [150,200,118] : [64,116,70],[14,26,40],1-day), 0.8);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for(var i=p;i<count;i+=2){
      var gx = x0 + rnd(seed+i*3.1)*(x1-x0), gy = y0 + rnd(seed+i*7.7)*(y1-y0);
      var gh = (0.006 + rnd(seed+i*1.3)*0.006)*ch;
      ctx.moveTo(gx-2.5, gy); ctx.lineTo(gx-3.5+lean, gy-gh*0.8);
      ctx.moveTo(gx, gy); ctx.lineTo(gx+lean, gy-gh);
      ctx.moveTo(gx+2.5, gy); ctx.lineTo(gx+3.5+lean, gy-gh*0.75);
    }
    ctx.stroke();
  }
}
// Nenúfares: pts = [[fx, fy, tamaño, flor]]
function drawLilyPads(pts, day){
  for(var i=0;i<pts.length;i++){
    var lx = pts[i][0]*cw + Math.sin(simT*0.6+i*1.9)*0.0015*cw, ly = pts[i][1]*ch + Math.sin(simT*0.9+i)*0.001*ch;
    var r = pts[i][2]*cw;
    ctx.fillStyle = cstr(mixc(i%2 ? [70,140,84] : [92,160,96],[14,30,36],1-day),1);
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.ellipse(lx, ly, r, r*0.36, 0, 0.35, TAU-0.25);
    ctx.closePath(); ctx.fill();
    if(pts[i][3]){
      ctx.fillStyle = cstr(mixc([250,190,210],[90,70,96],(1-day)*0.8),1);
      ctx.beginPath(); ctx.arc(lx-r*0.25, ly-r*0.2, r*0.28, Math.PI, 0); ctx.fill();
      ctx.fillStyle = cstr(mixc([255,236,150],[110,100,80],(1-day)*0.8),1);
      ctx.beginPath(); ctx.arc(lx-r*0.25, ly-r*0.22, r*0.1, 0, TAU); ctx.fill();
    }
  }
}
// Juncos y espadañas
function drawReeds(cx, base, n, h, day){
  var lean = (Math.sin(simT*1.5+cx*0.02)*0.5+0.6)*S.wind/60*0.012*cw;
  var g = cstr(mixc([92,136,72],[16,28,36],1-day),1), g2 = cstr(mixc([62,104,58],[10,20,28],1-day),1);
  var head = cstr(mixc([110,74,46],[26,20,20],1-day),1);
  for(var i=0;i<n;i++){
    var rx = cx + (rnd(cx+i*2.3)-0.5)*0.03*cw, rh = h*(0.6+rnd(cx+i*5.1)*0.5);
    var tx = rx + (rnd(cx+i*9.1)-0.5)*0.008*cw + lean*(rh/h);
    ctx.strokeStyle = i%2 ? g : g2; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(rx, base); ctx.quadraticCurveTo(rx, base-rh*0.6, tx, base-rh); ctx.stroke();
    if(i%3===0){
      ctx.strokeStyle = head; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(tx, base-rh); ctx.lineTo(tx-(tx-rx)*0.2, base-rh+0.016*ch); ctx.stroke();
      ctx.lineCap = 'butt';
    }
  }
}
function drawLakePlants(st){
  var day = st.day;
  drawReeds(0.105*cw, 0.612*ch, 9, 0.045*ch, day);
  drawReeds(0.205*cw, 0.612*ch, 7, 0.038*ch, day);
  drawReeds(0.905*cw, 0.610*ch, 9, 0.042*ch, day);
  drawReeds(0.585*cw, 0.609*ch, 5, 0.030*ch, day);
  drawLilyPads([[0.275,0.622,0.008,1],[0.292,0.630,0.010,0],[0.312,0.624,0.007,0],[0.845,0.626,0.009,1],[0.868,0.633,0.011,0],[0.826,0.634,0.007,0],[0.62,0.620,0.007,1]], day);
}

function drawStar(cx,cy,r){
  ctx.beginPath();
  for(var i=0;i<10;i++){
    var ang = -Math.PI/2 + i*Math.PI/5;
    var rad = (i%2===0) ? r : r*0.4;
    var px = cx + Math.cos(ang)*rad, py = cy + Math.sin(ang)*rad;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fill();
}
function drawUsFlag(x,y,w,wind,ph){
  var h = w/1.9;
  var RED = '#b22234', BLUE = '#3c3b6e', WHITE = '#ffffff';
  var amp = h*0.16*(0.45 + Math.min(1, wind/80));
  var cols = 16;
  function wob(xx, yy){
    var t = clamp((xx-x)/w, 0, 1);
    return yy + Math.sin((xx-x)*0.06 + ph)*amp*t;
  }
  var stripes = 13, sh = h/stripes;
  for(var i=0;i<stripes;i++){
    var y0 = y + i*sh, y1 = y0 + sh;
    ctx.fillStyle = (i%2===0) ? RED : WHITE;
    ctx.beginPath();
    ctx.moveTo(x, wob(x,y0));
    for(var c=1;c<=cols;c++){ var xx = x + w*c/cols; ctx.lineTo(xx, wob(xx,y0)); }
    ctx.lineTo(x+w, wob(x+w,y1));
    for(c=cols;c>=1;c--){ var xx2 = x + w*c/cols; ctx.lineTo(xx2, wob(xx2,y1)); }
    ctx.lineTo(x, wob(x,y1));
    ctx.closePath();
    ctx.fill();
  }
  var cw = w*0.4, chh = h*7/13;
  ctx.fillStyle = BLUE;
  ctx.beginPath();
  ctx.moveTo(x, wob(x,y));
  for(var c=1;c<=cols;c++){ var xx = x + cw*c/cols; ctx.lineTo(xx, wob(xx,y)); }
  ctx.lineTo(x+cw, wob(x+cw,y+chh));
  for(c=cols;c>=1;c--){ var xx2 = x + cw*c/cols; ctx.lineTo(xx2, wob(xx2,y+chh)); }
  ctx.lineTo(x, wob(x,y+chh));
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = WHITE;
  for(var row=0;row<9;row++){
    var n = (row%2===0)?6:5;
    var off = (6-n)/2;
    for(var s=0;s<n;s++){
      var sX = x + cw*(s + off + 0.5)/6;
      var sY = wob(sX, y + chh*(row + 0.5)/9);
      drawStar(sX, sY, h*0.022);
    }
  }
}

function drawWater(st){
  var day = st.day;
  var hor = ch*0.60;
  var wTop = mixc(mixc([90,160,198],[168,206,224],0.35), [14,26,48], 1-day);
  var wBot = mixc(mixc([44,110,160],[30,84,132],0.5), [6,12,26], 1-day);
  wTop = mixc(wTop,[80,92,112],clamp(S.clouds*0.8,0,1)*0.45);
  wBot = mixc(wBot,[48,58,76],clamp(S.clouds*0.8,0,1)*0.4);
  var g = ctx.createLinearGradient(0,hor,0,ch);
  g.addColorStop(0,cstr(wTop));
  g.addColorStop(1,cstr(wBot));
  ctx.fillStyle=g;
  ctx.fillRect(0,hor,cw,ch-hor);

  var rg = ctx.createLinearGradient(0,hor,0,ch);
  var skyRef = mixc([205,232,250],[40,62,96],1-day);
  rg.addColorStop(0, cstr(skyRef, 0.5));
  rg.addColorStop(1, cstr(skyRef, 0.18));
  ctx.fillStyle=rg;
  ctx.fillRect(0,hor,cw,ch-hor);

  var hrf = ctx.createLinearGradient(0,hor,0,hor+ch*0.17);
  var refC = mixc(WALL,[60,70,96],1-day);
  hrf.addColorStop(0, cstr(refC, 0.42));
  hrf.addColorStop(0.35, cstr(mixc(refC,ROOF,0.5), 0.22));
  hrf.addColorStop(1, cstr(refC, 0));
  ctx.fillStyle = hrf;
  ctx.fillRect(0,hor,cw,ch*0.17);
  for(var lr=0; lr<9; lr++){
    ctx.fillStyle = cstr(mixc(lr%2 ? [240,236,226] : [190,40,44],[40,40,60],(1-day)*0.7), 0.42-lr*0.04);
    ctx.fillRect(0.150*cw - 0.011*cw + Math.sin(simT*1.5+lr*1.3)*0.003*cw, hor+ch*(0.022+lr*0.017), 0.022*cw, ch*0.011);
  }

  if(st.sun.visible && st.day>0.05){
    for(var i=0;i<7;i++){
      var fy = hor + (ch-hor)*i/7;
      var span = cw*(0.02 + 0.10*i/7)*(0.5+st.day);
      ctx.fillStyle = cstr([255,224,150], 0.5 - 0.06*i);
      ctx.fillRect(st.sun.x-span/2, fy, span, 1.8+2.2*i/7);
    }
  }

  var chop = 0.5 + clamp(S.wind/40,0,1)*1.6;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(var r=0;r<12;r++){
    var yy = hor + (ch-hor)*(r+1)/12;
    var alpha = 0.10*(1-r/12*0.8)*(0.4+0.6*st.day);
    if(day<0.25) alpha *= 0.5;
    for(var cIdx=0;cIdx<30;cIdx++){
      var bx = (cIdx + 0.5*Math.sin(simT*1.2 + r*1.7 + cIdx*0.8))*cw/30;
      var wlen = cw/30*(0.6+0.5*chop);
      var ph2 = Math.sin(simT*(1.2+chop*0.5) + cIdx*0.9 + r);
      ctx.globalAlpha = alpha*clamp(ph2,0.25,1);
      ctx.fillRect(bx-wlen/2, yy, wlen, 1.2+chop*0.7);
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.fillStyle = cstr(mixc([200,230,244],[40,60,90],1-day),0.16);
  for(var i=0;i<4;i++){
    var fx = ((simT*(0.03+chop*0.02)+i*0.37)%1.5-0.25)*cw;
    var fy = ch*(0.70+i*0.075);
    ctx.beginPath();
    ctx.ellipse(fx, fy, cw*(0.16+i*0.03), ch*0.006, 0, 0, TAU);
    ctx.fill();
  }
}

function drawWindowReflections(day){
  if(day>0.65) return;
  var hor = ch*0.60;
  var alphaRefl = (1-day)*0.5;
  for(var i=0;i<windows.length;i++){
    var wp=windows[i];
    if(!wp.lit) continue;
    var gy = hor + (ch-hor)*(0.01 + rnd(i)*0.07);
    var gh = (ch-hor)*(0.16 + rnd(i+3.1)*0.16);
    var gg = ctx.createLinearGradient(0,gy,0,gy+gh);
    gg.addColorStop(0, cstr(LAMP_GLOW, alphaRefl*0.4));
    gg.addColorStop(1, cstr(LAMP_GLOW,0));
    ctx.fillStyle = gg;
    ctx.fillRect(wp.x + wp.w*0.2 + Math.sin(simT*1.4+i)*wp.w*0.12, gy, wp.w*0.6, gh);
  }
}

function drawGoldLights(pts, day){
  var f = Math.max(0, Math.min(1, 1.3*(1-day)));
  if(f<=0.02) return;
  ctx.strokeStyle = cstr(GOLD, 0.55*f);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}

function hotelPal(day){
  var n = 1-day;
  return {
    wall: mixc(WALL,[34,42,60],n), wallS: mixc(WALL_SH,[22,30,46],n), wallL: mixc([246,240,224],[46,54,72],n),
    trim: mixc(TRIM,[70,78,96],n), roof: mixc(ROOF,[14,20,34],n), roofD: mixc(ROOF_D,[9,14,25],n),
    roofL: mixc([98,128,150],[24,32,50],n), glass: mixc(NAVY,[22,28,46],n), line: mixc([172,160,138],[12,18,30],n)
  };
}
// Lamas horizontales de la fachada de madera
function clapboard(x, y, w, h, P){
  ctx.strokeStyle = cstr(P.line,0.32); ctx.lineWidth = 1;
  ctx.beginPath();
  for(var yy=y+0.008*ch; yy<y+h; yy+=0.008*ch){ ctx.moveTo(x,yy); ctx.lineTo(x+w,yy); }
  ctx.stroke();
}
function roofBand(x0, x1, yt, yb, P){
  var g = ctx.createLinearGradient(0,yt,0,yb);
  g.addColorStop(0,cstr(P.roofL)); g.addColorStop(0.45,cstr(P.roof)); g.addColorStop(1,cstr(P.roofD));
  ctx.fillStyle = g;
  ctx.fillRect(x0, yt, x1-x0, yb-yt);
  ctx.strokeStyle = cstr(P.roofD,0.5); ctx.lineWidth = 1;
  ctx.beginPath();
  for(var yy=yt+0.008*ch; yy<yb; yy+=0.008*ch){ ctx.moveTo(x0,yy); ctx.lineTo(x1,yy); }
  ctx.stroke();
}
function drawCornice(x0, x1, y, P){
  ctx.fillStyle = cstr(P.trim);
  ctx.fillRect(x0, y-0.008*ch, x1-x0, 0.012*ch);
  ctx.fillStyle = cstr(P.line,0.55);
  ctx.fillRect(x0, y+0.004*ch, x1-x0, 0.004*ch);
}
function drawBalustrade(x0, x1, y, h, P){
  ctx.strokeStyle = cstr(P.trim); ctx.lineWidth = 1.2;
  ctx.beginPath();
  for(var xx=x0; xx<=x1+0.5; xx+=0.0055*cw){ ctx.moveTo(xx,y); ctx.lineTo(xx,y-h); }
  ctx.stroke();
  ctx.fillStyle = cstr(P.trim);
  ctx.fillRect(x0, y-h-0.003*ch, x1-x0, 0.004*ch);
}

function drawTower(twX, P, day){
  var hw = 0.038*cw, yb = 0.214*ch, yt = 0.132*ch;
  var lit = day<0.5;
  var g = ctx.createLinearGradient(twX-hw,0,twX+hw,0);
  g.addColorStop(0,cstr(P.wallL)); g.addColorStop(0.6,cstr(P.wall)); g.addColorStop(1,cstr(P.wallS));
  ctx.fillStyle = g;
  ctx.fillRect(twX-hw, yt, hw*2, yb-yt);
  clapboard(twX-hw, yt, hw*2, yb-yt, P);
  ctx.fillStyle = cstr(P.trim);
  ctx.fillRect(twX-hw, yt, 0.005*cw, yb-yt);
  ctx.fillRect(twX+hw-0.005*cw, yt, 0.005*cw, yb-yt);
  var tww = 0.0168*cw, twh = 0.031*ch;
  drawWindow(twX-0.020*cw-tww/2, 0.160*ch, tww, twh, lit && rnd(twX)>0.4, day, false);
  drawWindow(twX+0.020*cw-tww/2, 0.160*ch, tww, twh, lit && rnd(twX*1.7)>0.4, day, false);
  drawCornice(twX-hw-0.005*cw, twX+hw+0.005*cw, yt, P);
  drawBalustrade(twX-hw, twX+hw, yt-0.008*ch, 0.014*ch, P);
  // Linterna
  var lw = 0.022*cw, ly0 = yt-0.008*ch, ly1 = 0.084*ch;
  var lg = ctx.createLinearGradient(twX-lw,0,twX+lw,0);
  lg.addColorStop(0,cstr(P.wallL)); lg.addColorStop(0.55,cstr(P.wall)); lg.addColorStop(1,cstr(P.wallS));
  ctx.fillStyle = lg;
  ctx.fillRect(twX-lw, ly1, lw*2, ly0-ly1);
  for(var k=-1; k<=1; k++){
    var ax = twX + k*lw*0.62, ar = lw*0.2, ay = ly1+0.016*ch;
    ctx.beginPath();
    ctx.moveTo(ax-ar, ly0-0.004*ch); ctx.lineTo(ax-ar, ay);
    ctx.arc(ax, ay, ar, Math.PI, 0);
    ctx.lineTo(ax+ar, ly0-0.004*ch); ctx.closePath();
    ctx.fillStyle = lit ? cstr(LAMP,0.95) : cstr(P.glass);
    ctx.fill();
    ctx.strokeStyle = cstr(P.trim); ctx.lineWidth = 1.2; ctx.stroke();
  }
  if(lit){
    var tg = ctx.createRadialGradient(twX, (ly0+ly1)/2, 2, twX, (ly0+ly1)/2, 0.05*cw);
    tg.addColorStop(0,cstr(LAMP_GLOW,0.4)); tg.addColorStop(1,cstr(LAMP_GLOW,0));
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.arc(twX, (ly0+ly1)/2, 0.05*cw, 0, TAU); ctx.fill();
  }
  drawCornice(twX-lw-0.004*cw, twX+lw+0.004*cw, ly1, P);
  // Cubierta de la cúpula
  var ry0 = ly1-0.008*ch, ryp = 0.036*ch;
  var rg = ctx.createLinearGradient(twX-lw,0,twX+lw,0);
  rg.addColorStop(0,cstr(P.roofL)); rg.addColorStop(0.5,cstr(P.roof)); rg.addColorStop(1,cstr(P.roofD));
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.moveTo(twX-lw*1.2, ry0);
  ctx.quadraticCurveTo(twX-lw*0.3, ry0-0.014*ch, twX, ryp);
  ctx.quadraticCurveTo(twX+lw*0.3, ry0-0.014*ch, twX+lw*1.2, ry0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = cstr(mixc([92,92,92],[22,22,28],1-day),1);
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(twX, ryp+0.004*ch); ctx.lineTo(twX, 0.010*ch); ctx.stroke();
  ctx.fillStyle = cstr(LAMP,1);
  ctx.beginPath(); ctx.arc(twX, ryp, 2.6, 0, TAU); ctx.fill();
  drawGoldLights([[twX-hw,yt-0.010*ch],[twX+hw,yt-0.010*ch]], day);
  drawGoldLights([[twX-lw*1.2,ry0],[twX+lw*1.2,ry0]], day);
}

function drawWing(xl, xr, P, day){
  var eaveW=0.232*ch, ridgeW=0.186*ch, base=0.505*ch;
  var g = ctx.createLinearGradient(0,eaveW,0,base);
  g.addColorStop(0,cstr(P.wallS)); g.addColorStop(0.12,cstr(P.wall)); g.addColorStop(1,cstr(P.wallS));
  ctx.fillStyle = g;
  ctx.fillRect(xl, eaveW, xr-xl, base-eaveW);
  clapboard(xl, eaveW, xr-xl, base-eaveW, P);
  roofBand(xl, xr, ridgeW, eaveW, P);
  ctx.fillStyle = cstr(P.trim);
  ctx.fillRect(xl, ridgeW-0.003*ch, xr-xl, 0.004*ch);
  drawCornice(xl, xr, eaveW, P);
  var dfr = [0.08,0.24,0.76,0.92];
  for(var di=0; di<4; di++) drawDormer(xl + dfr[di]*(xr-xl), eaveW-0.010*ch, 0.85, P, day);
  // Pabellón central con frontón
  var pc = (xl+xr)/2, ph = 0.052*cw;
  ctx.fillStyle = cstr(P.wallL,0.6);
  ctx.fillRect(pc-ph, eaveW, ph*2, base-eaveW);
  ctx.fillStyle = cstr(P.trim);
  ctx.fillRect(pc-ph, eaveW, 0.004*cw, base-eaveW);
  ctx.fillRect(pc+ph-0.004*cw, eaveW, 0.004*cw, base-eaveW);
  drawGable(pc, ph+0.006*cw, 0.158*ch, eaveW+0.004*ch, P, day);
  ctx.fillStyle = cstr(P.trim,0.9);
  ctx.fillRect(xl, 0.452*ch, xr-xl, 0.006*ch);
}

function drawHotel(st){
  var day = st.day, lit = day<0.5;
  var P = hotelPal(day);
  var wallL=0.26*cw, wallR=0.74*cw;
  var eave=0.214*ch, base=0.50*ch, ridgeY=0.150*ch;

  ctx.save();

  drawWing(0, 0.26*cw, P, day);
  drawWing(0.74*cw, cw, P, day);

  // Cuerpo central
  var g = ctx.createLinearGradient(0,eave,0,base);
  g.addColorStop(0,cstr(P.wallS)); g.addColorStop(0.1,cstr(P.wall)); g.addColorStop(1,cstr(P.wallS));
  ctx.fillStyle = g;
  ctx.fillRect(wallL, eave, wallR-wallL, base-eave);
  ctx.fillStyle = cstr(P.wallL,0.65);
  ctx.fillRect(0.395*cw, eave, 0.21*cw, base-eave);
  clapboard(wallL, eave, wallR-wallL, base-eave, P);
  ctx.fillStyle = cstr(P.trim);
  ctx.fillRect(wallL, 0.355*ch, wallR-wallL, 0.007*ch);
  var pil = [0.26,0.338,0.395,0.600,0.657,0.735];
  for(var pi=0; pi<pil.length; pi++) ctx.fillRect(pil[pi]*cw, eave, 0.005*cw, base-eave);

  roofBand(wallL, wallR, ridgeY, eave, P);
  drawBalustrade(wallL+0.085*cw, wallR-0.085*cw, ridgeY+0.002*ch, 0.014*ch, P);
  drawCornice(wallL, wallR, eave, P);
  var dxs = [0.362,0.402,0.598,0.638];
  for(var di=0; di<dxs.length; di++) drawDormer(dxs[di]*cw, eave-0.010*ch, 1, P, day);

  // Frontón central con ventana palladiana
  var pedX=0.50*cw, pedHalf=0.108*cw, pBase=eave+0.004*ch, pPeak=0.100*ch;
  drawGable(pedX, pedHalf, pPeak, pBase, P, day, true);

  drawTower(0.300*cw, P, day);
  drawTower(0.700*cw, P, day);
  drawUsFlag(0.700*cw+1.5, 0.012*ch, 0.031*cw, S.wind, simT*2.4+2.1);
  drawUsFlag(0.300*cw+1.5, 0.012*ch, 0.031*cw, S.wind, simT*2.4+4.7);
  drawGoldLights([[pedX-pedHalf,pBase],[pedX,pPeak],[pedX+pedHalf,pBase]], day);
  drawGoldLights([[wallL,eave+0.003*ch],[wallR,eave+0.003*ch]], day);
  drawGoldLights([[0,0.232*ch+0.003*ch],[0.26*cw,0.232*ch+0.003*ch]], day);
  drawGoldLights([[0.74*cw,0.232*ch+0.003*ch],[cw,0.232*ch+0.003*ch]], day);

  for(var i=0;i<windows.length;i++){
    var wp = windows[i];
    drawWindow(wp.x, wp.y, wp.w, wp.h, wp.lit, day, wp.aw);
  }

  // Galería porticada
  var vx0 = wallL+0.012*cw, vx1 = wallR-0.012*cw;
  var vy0 = 0.458*ch, vy1 = 0.472*ch, vf = 0.488*ch, vb = 0.540*ch;
  var vg = ctx.createLinearGradient(0,vy0,0,vy1);
  vg.addColorStop(0,cstr(P.roofL)); vg.addColorStop(1,cstr(P.roofD));
  ctx.fillStyle = vg;
  ctx.beginPath();
  ctx.moveTo(vx0+0.008*cw, vy0); ctx.lineTo(vx1-0.008*cw, vy0);
  ctx.lineTo(vx1+0.004*cw, vy1); ctx.lineTo(vx0-0.004*cw, vy1);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = cstr(mixc([62,74,92],[16,20,30],1-day),1);
  ctx.fillRect(vx0, vf, vx1-vx0, vb-vf);
  if(day<0.55){
    var ig = ctx.createLinearGradient(0,vf,0,vb);
    ig.addColorStop(0,cstr(LAMP,0.62)); ig.addColorStop(1,cstr(LAMP_GLOW,0.25));
    ctx.fillStyle = ig;
    ctx.fillRect(vx0, vf, vx1-vx0, vb-vf);
  } else {
    ctx.fillStyle = cstr(mixc(GLASS_DAY,[60,80,104],0.55),0.55);
    var dn = 16, ds = (vx1-vx0)/dn;

  }
  ctx.fillStyle = cstr(P.trim);
  ctx.fillRect(vx0-0.002*cw, vy1, vx1-vx0+0.004*cw, vf-vy1);
  var cn = 16, cs = (vx1-vx0)/cn;
  for(var ci=0; ci<=cn; ci++){

    ctx.fillStyle = cstr(P.trim);
    ctx.fillRect(cx-0.0045*cw, vf, 0.009*cw, 0.004*ch);
  }
  drawBalustrade(vx0, pedX-0.037*cw, vb, 0.018*ch, P);
  drawBalustrade(pedX+0.037*cw, vx1, vb, 0.018*ch, P);
  ctx.fillStyle = cstr(mixc([206,198,182],[36,42,56],1-day),1);
  ctx.fillRect(vx0-0.004*cw, vb, vx1-vx0+0.008*cw, 0.010*ch);
  for(var sti=0; sti<4; sti++){

    ctx.fillStyle = cstr(mixc([232,226,212],[48,54,68],1-day),1);

    ctx.fillStyle = cstr(P.line,0.5);
    ctx.fillRect(pedX-swx/2, sy+0.008*ch, swx, 0.0025*ch);
  }

  // Rótulo: tablero azul marino con letras doradas, iluminado al caer la luz
  var sgl = smooth(0.7,0.4,day);
  var sx0 = pedX-0.105*cw, sy0 = 0.459*ch, sw0 = 0.21*cw, sh0 = 0.031*ch;
  ctx.fillStyle = cstr(mixc(TRIM,[70,78,96],1-day),1);
  ctx.fillRect(sx0-3, sy0-3, sw0+6, sh0+6);
  var sbg = ctx.createLinearGradient(0,sy0,0,sy0+sh0);
  sbg.addColorStop(0, cstr(mixc([44,62,92],[30,44,70],1-day)));
  sbg.addColorStop(1, cstr(mixc(NAVY,[18,26,44],1-day)));
  ctx.fillStyle = sbg;
  ctx.fillRect(sx0, sy0, sw0, sh0);
  ctx.strokeStyle = cstr(mixc([255,217,138],GOLD,sgl*0.5), 0.9);
  ctx.lineWidth = 1.5;
  ctx.strokeRect(sx0+3, sy0+3, sw0-6, sh0-6);
  ctx.font = '700 '+Math.max(12,ch*0.0195)+'px Poppins, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.save();
  if(sgl>0.02){ ctx.shadowColor = cstr(GOLD_GLOW, 0.9*sgl); ctx.shadowBlur = 10*sgl; }
  ctx.fillStyle = cstr(mixc([255,217,138],[255,236,180],sgl),1);
  ctx.fillText('NEWPORT BAY CLUB', pedX, sy0+sh0*0.54);
  ctx.restore();
  if(sgl>0.02){
    var slg = ctx.createRadialGradient(pedX, sy0+sh0/2, 0.01*cw, pedX, sy0+sh0/2, 0.13*cw);
    slg.addColorStop(0, cstr(LAMP_GLOW, 0.22*sgl)); slg.addColorStop(1, cstr(LAMP_GLOW, 0));
    ctx.fillStyle = slg;
    ctx.fillRect(pedX-0.13*cw, sy0-0.03*ch, 0.26*cw, sh0+0.06*ch);
  }

  // Setos, macizos de flores y hierba
  drawGrassTufts(0, cw, 0.535*ch, 0.578*ch, 70, day, 5);
  for(var hb=0; hb<64; hb++){
    var hx = (hb+0.5)/64*cw;
    if(Math.abs(hx-pedX) < 0.058*cw) continue;
    var inC = hx>vx0-0.01*cw && hx<vx1+0.01*cw;
    drawBush(hx, (inC ? 0.556 : 0.514)*ch, (0.0088 + rnd(hb*4.3)*0.004)*cw, day);
  }
  var FL = [[226,60,70],[250,246,240],[246,150,176],[250,206,80]];
  for(var fl=0; fl<110; fl++){
    var flx = vx0 + rnd(fl*3.7)*(vx1-vx0);
    if(Math.abs(flx-pedX) < 0.062*cw) continue;
    ctx.fillStyle = cstr(mixc(FL[fl%4],[30,30,48],(1-day)*0.8),1);
    ctx.beginPath(); ctx.arc(flx, (0.568+rnd(fl*9.1)*0.007)*ch, 2.1, 0, TAU); ctx.fill();
  }

  ctx.restore();
}
function drawGable(cx, half, peakY, baseY, P, day, big){
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx-half, baseY); ctx.lineTo(cx+half, baseY); ctx.lineTo(cx, peakY);
  ctx.closePath();
  ctx.fillStyle = cstr(P.wallL); ctx.fill();
  ctx.clip();
  clapboard(cx-half, peakY, half*2, baseY-peakY, P);
  ctx.restore();
  ctx.strokeStyle = cstr(P.roof); ctx.lineWidth = big ? 9 : 6; ctx.lineJoin = 'miter';
  ctx.beginPath(); ctx.moveTo(cx-half-0.004*cw, baseY); ctx.lineTo(cx, peakY-0.004*ch); ctx.lineTo(cx+half+0.004*cw, baseY); ctx.stroke();
  ctx.strokeStyle = cstr(P.trim); ctx.lineWidth = big ? 4 : 2.5;
  ctx.beginPath(); ctx.moveTo(cx-half, baseY); ctx.lineTo(cx, peakY+0.004*ch); ctx.lineTo(cx+half, baseY); ctx.stroke();
  ctx.fillStyle = cstr(P.trim);
  ctx.fillRect(cx-half, baseY-0.004*ch, half*2, 0.008*ch);
  var lit = day<0.5;
  var hh = baseY-peakY, r = big ? 0.016*cw : 0.0095*cw, wy = baseY - hh*0.30;
  ctx.fillStyle = lit ? cstr(LAMP,0.95) : cstr(mixc(GLASS_DAY,P.glass,0.45));
  ctx.beginPath();
  ctx.moveTo(cx-r, wy+r*1.2); ctx.lineTo(cx-r, wy); ctx.arc(cx, wy, r, Math.PI, 0); ctx.lineTo(cx+r, wy+r*1.2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = cstr(P.trim); ctx.lineWidth = big ? 2.5 : 1.5; ctx.stroke();
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, wy-r); ctx.lineTo(cx, wy+r*1.2);
  ctx.moveTo(cx-r, wy); ctx.lineTo(cx+r, wy);
  ctx.stroke();
  if(big){
    for(var s=-1; s<=1; s+=2){
      ctx.fillStyle = lit ? cstr(LAMP,0.9) : cstr(mixc(GLASS_DAY,P.glass,0.45));
      ctx.fillRect(cx+s*r*1.75-r*0.4, wy, r*0.8, r*1.2);

}

function drawWindow(x,y,w,h,lit,day,aw){
  var frame = mixc(TRIM,[70,78,96],1-day);
  var shut = mixc(SHUT,[10,16,28],1-day);
  var sw2 = w*0.24;
  if(!aw){
    ctx.fillStyle = cstr(shut,1);
    ctx.fillRect(x-sw2, y-h*0.04, sw2, h*1.08);
    ctx.fillRect(x+w, y-h*0.04, sw2, h*1.08);
  }
  ctx.fillStyle = cstr(frame,1);
  ctx.fillRect(x-w*0.06, y-h*0.06, w*1.12, h*1.12);
  if(lit){
    ctx.fillStyle = cstr(LAMP,1);
    ctx.fillRect(x+w*0.08, y+h*0.08, w*0.84, h*0.84);
    ctx.fillStyle = cstr(LAMP_GLOW,0.3);
    ctx.fillRect(x-w*0.16, y-h*0.16, w*1.32, h*1.32);
  } else {
    var gl = mixc(GLASS_DAY, GLASS_DRK, 1-day);
    ctx.fillStyle = cstr(gl,1);
    ctx.fillRect(x+w*0.08, y+h*0.08, w*0.84, h*0.84);
    ctx.fillStyle = cstr([255,255,255],0.22*day);
    ctx.beginPath();
    ctx.moveTo(x+w*0.08, y+h*0.55); ctx.lineTo(x+w*0.55, y+h*0.08); ctx.lineTo(x+w*0.8, y+h*0.08); ctx.lineTo(x+w*0.08, y+h*0.8);
    ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = cstr(frame,1);
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x+w/2, y); ctx.lineTo(x+w/2, y+h);
  ctx.moveTo(x, y+h/2); ctx.lineTo(x+w, y+h/2);
  ctx.stroke();
  ctx.fillStyle = cstr(frame,1);
  ctx.fillRect(x-w*0.14, y+h*1.04, w*1.28, h*0.09);
  if(aw){
    // Toldo de rayas
    var ax0 = x-w*0.10, ax1 = x+w*1.10, bx0 = x-w*0.24, bx1 = x+w*1.24, ay0 = y-h*0.14, ay1 = y+h*0.34;
    for(var s=0; s<5; s++){
      ctx.fillStyle = cstr(mixc(s%2 ? [246,246,240] : [58,98,150],[20,26,42],(1-day)*0.75),1);
      ctx.beginPath();
      ctx.moveTo(lerp(ax0,ax1,s/5), ay0); ctx.lineTo(lerp(ax0,ax1,(s+1)/5), ay0);
      ctx.lineTo(lerp(bx0,bx1,(s+1)/5), ay1); ctx.lineTo(lerp(bx0,bx1,s/5), ay1);
      ctx.closePath(); ctx.fill();
    }
  }
}

function drawLighthouse(st){
  var day = st.day, nt = 1-day;
  var x = 0.150*cw, base = 0.60*ch, top = 0.315*ch;
  var wB = mixc([240,236,226],[50,58,76],nt);
  var rB = mixc([190,40,44],[84,26,30],nt);
  var dark = mixc([52,58,66],[12,16,24],nt);

  // Escollera
  for(var rk=0; rk<11; rk++){
    var rxx = x + (rk-5)*0.0105*cw + (rnd(rk*3.7)-0.5)*0.006*cw;
    var ryy = base + 0.012*ch + rnd(rk*5.1)*0.010*ch - (1-Math.abs(rk-5)/5)*0.012*ch;
    var rr = (0.010 + rnd(rk*7.3)*0.007)*cw;
    ctx.fillStyle = cstr(mixc(rk%2 ? [120,124,130] : [96,100,108],[16,22,32],nt),1);
    ctx.beginPath(); ctx.ellipse(rxx, ryy, rr, rr*0.55, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = cstr(mixc([164,168,172],[30,38,50],nt),1);
    ctx.beginPath(); ctx.ellipse(rxx-rr*0.2, ryy-rr*0.2, rr*0.5, rr*0.22, 0, 0, TAU); ctx.fill();
  }

  // Fuste troncocónico a franjas
  var wb2 = 0.017*cw, wt2 = 0.0105*cw, n = 5, bandH = (base-top)/n;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x-wb2, base); ctx.lineTo(x-wt2, top); ctx.lineTo(x+wt2, top); ctx.lineTo(x+wb2, base);
  ctx.closePath(); ctx.clip();
  for(var b=0; b<n; b++){
    ctx.fillStyle = cstr(b%2===0 ? rB : wB, 1);
    ctx.fillRect(x-wb2, top+b*bandH, wb2*2, bandH+1);
  }
  var sg = ctx.createLinearGradient(x-wb2,0,x+wb2,0);
  sg.addColorStop(0,cstr([255,255,255],0.10)); sg.addColorStop(0.35,cstr([255,255,255],0.16));
  sg.addColorStop(0.6,cstr([0,0,0],0)); sg.addColorStop(1,cstr([0,0,0],0.32));
  ctx.fillStyle = sg;
  ctx.fillRect(x-wb2, top, wb2*2, base-top);
  ctx.restore();
  ctx.fillStyle = cstr(dark,1);
  ctx.beginPath();
  ctx.moveTo(x-0.004*cw, base); ctx.lineTo(x-0.004*cw, base-0.022*ch);
  ctx.arc(x, base-0.022*ch, 0.004*cw, Math.PI, 0); ctx.lineTo(x+0.004*cw, base);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = day<0.5 ? cstr(LAMP,0.95) : cstr(dark,1);
  ctx.fillRect(x-0.0022*cw, top+bandH*1.35, 0.0044*cw, 0.016*ch);
  ctx.fillRect(x-0.0022*cw, top+bandH*3.3, 0.0044*cw, 0.016*ch);

  // Galería, linterna y cúpula
  var gy = top, gw = 0.019*cw;
  ctx.fillStyle = cstr(dark,1);
  ctx.fillRect(x-gw, gy-0.006*ch, gw*2, 0.008*ch);
  ctx.strokeStyle = cstr(dark,1); ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x-gw, gy-0.024*ch); ctx.lineTo(x+gw, gy-0.024*ch);
  for(var gi=0; gi<=8; gi++){ ctx.moveTo(x-gw+gi*gw/4, gy-0.006*ch); ctx.lineTo(x-gw+gi*gw/4, gy-0.024*ch); }
  ctx.stroke();
  var lw = 0.0095*cw, ly0 = gy-0.006*ch, ly1 = gy-0.060*ch;
  var on = day<0.55;
  ctx.fillStyle = on ? cstr([255,236,170],0.98) : cstr(mixc([176,206,230],[40,60,90],nt),0.95);
  ctx.fillRect(x-lw, ly1, lw*2, ly0-ly1);
  ctx.strokeStyle = cstr(dark,1); ctx.lineWidth = 1.4;
  ctx.beginPath();
  for(var li=0; li<=4; li++){ ctx.moveTo(x-lw+li*lw/2, ly1); ctx.lineTo(x-lw+li*lw/2, ly0); }
  ctx.stroke();
  ctx.fillStyle = cstr(rB,1);
  ctx.beginPath();
  ctx.moveTo(x-lw*1.35, ly1);
  ctx.quadraticCurveTo(x-lw*0.9, ly1-0.030*ch, x, ly1-0.040*ch);
  ctx.quadraticCurveTo(x+lw*0.9, ly1-0.030*ch, x+lw*1.35, ly1);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = cstr(dark,1); ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(x, ly1-0.040*ch); ctx.lineTo(x, ly1-0.062*ch); ctx.stroke();
  ctx.fillStyle = cstr([235,190,70],1);
  ctx.beginPath(); ctx.arc(x, ly1-0.044*ch, 0.0032*cw, 0, TAU); ctx.fill();

  if(on){
    var pX = x, pY = (ly0+ly1)/2;
    var hg = ctx.createRadialGradient(pX,pY,1,pX,pY,0.04*cw);
    hg.addColorStop(0,cstr([255,230,160],0.7)); hg.addColorStop(1,cstr([255,230,160],0));
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(pX,pY,0.04*cw,0,TAU); ctx.fill();
    var sweep = (simT*0.07) % 1;
    var tX = pX + 0.05*cw + sweep*0.78*cw;
    var tY = base + 0.02*ch;
    var ang = Math.atan2(tY-pY, tX-pX);
    var e = Math.min(sweep, 1-sweep);
    var fade = Math.min(1, e/0.10);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = fade;
    ctx.translate(pX,pY);
    ctx.rotate(ang);
    var bgr = ctx.createLinearGradient(0,0,cw*0.8,0);
    bgr.addColorStop(0, cstr([255,226,150],0.55));
    bgr.addColorStop(1, cstr([255,226,150],0));
    ctx.fillStyle = bgr;
    ctx.beginPath();
    ctx.moveTo(0,-0.02*ch); ctx.lineTo(cw*0.6, -cw*0.05); ctx.lineTo(cw*0.6, cw*0.05); ctx.lineTo(0,0.02*ch);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

var ducks = [];
function initDucks(){
  ducks = [];
  for(var i=0;i<5;i++){
    var x = 0.10*cw + Math.random()*0.80*cw;
    var y = 0.63*ch + Math.random()*0.32*ch;
    var ang = Math.random()*TAU;
    var spd = 0.007*cw + Math.random()*0.010*cw;
    ducks.push({ x:x, y:y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, ph:Math.random()*10, bobF:1.2+Math.random()*0.8, chT: 2+Math.random()*5 });
  }
}
function mgmtDucks(dt){
  for(var i=0;i<ducks.length;i++){
    var d = ducks[i];
    d.chT -= dt;
    if(d.chT<=0){
      var ang = Math.random()*TAU;
      var spd = 0.007*cw + Math.random()*0.010*cw;
      d.vx = Math.cos(ang)*spd;
      d.vy = Math.sin(ang)*spd;
      d.chT = 3+Math.random()*6;
    }
    d.x += d.vx*dt;
    d.y += d.vy*dt;
    var x0=0.03*cw, x1=0.97*cw, y0=0.62*ch, y1=1.03*ch;
    if(d.x<x0){ d.x=x0; d.vx=Math.abs(d.vx); }
    if(d.x>x1){ d.x=x1; d.vx=-Math.abs(d.vx); }
    if(d.y<y0){ d.y=y0; d.vy=Math.abs(d.vy); }
    if(d.y>y1){ d.y=y1; d.vy=-Math.abs(d.vy); }
  }
}
function drawDucks(st){
  var day = st.day, nt = 1-day;
  var order = ducks.slice().sort(function(a,b){ return a.y-b.y; });
  for(var i=0;i<order.length;i++){
    var d = order[i];
    var bob = Math.sin(simT*d.bobF + d.ph)*0.003*ch;
    var s = 0.75 + (d.y/ch-0.62)*1.7;
    var u = 0.011*cw;
    ctx.save();
    ctx.translate(d.x, d.y+bob);
    ctx.scale((d.vx>=0 ? 1 : -1)*s, s);
    // estela y reflejo
    ctx.strokeStyle = cstr([255,255,255],0.35*(0.4+0.6*day)); ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-u*0.9, u*0.28); ctx.lineTo(-u*2.6, u*0.10);
    ctx.moveTo(-u*0.9, u*0.34); ctx.lineTo(-u*2.8, u*0.62);
    ctx.moveTo(u*1.1, u*0.32); ctx.quadraticCurveTo(u*1.5, u*0.42, u*1.2, u*0.52);
    ctx.stroke();
    ctx.fillStyle = cstr([10,24,40],0.22);
    ctx.beginPath(); ctx.ellipse(0, u*0.42, u*1.05, u*0.2, 0, 0, TAU); ctx.fill();
    // cuerpo
    ctx.fillStyle = cstr(mixc([150,122,88],[52,44,36],nt),1);
    ctx.beginPath();
    ctx.moveTo(-u*1.25, -u*0.42);
    ctx.quadraticCurveTo(-u*0.7, u*0.42, u*0.2, u*0.36);

function drawRain(){
  if(S.rain<0.02) return;
  var ang = clamp((S.wind-5)/85,0,1)*0.75-0.15;
  ctx.save();
  ctx.strokeStyle = 'rgba(185,205,225,0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(var i=0;i<raindrops.length;i++){
    var d = raindrops[i];
    var sp = d.sp*(1+S.rain*0.4);
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x - Math.sin(ang)*d.l, d.y + d.l);
  }
  ctx.stroke();
  ctx.restore();
}
function mgmtRain(dt){
  var ang = clamp((S.wind-5)/85,0,1)*0.75-0.15;
  for(var i=0;i<raindrops.length;i++){
    var d = raindrops[i];
    var sp = d.sp*(1+S.rain*0.4);
    d.y += sp*60*dt;
    d.x -= Math.sin(ang)*sp*60*dt*0.6;
    if(d.y > ch){ d.y = -10; d.x = Math.random()*cw; }
    if(d.x > cw+20) d.x = -10;
    if(d.x < -20) d.x = cw+10;
  }
}
function drawSnow(){
  if(S.snow<0.02) return;
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  for(var i=0;i<snowflakes.length;i++){
    var f = snowflakes[i];
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(f.x-f.r, f.y); ctx.lineTo(f.x+f.r, f.y); ctx.stroke();
  }
  ctx.restore();
}
function mgmtSnow(dt){
  var windPx = S.wind*0.02*cw*dt;
  for(var i=0;i<snowflakes.length;i++){
    var f = snowflakes[i];
    f.y += f.vy*60*dt;
    f.x += windPx*0.8 + Math.sin(simT*1.4 + f.p)*0.004*cw;
    if(f.y > ch+10){ f.y = -8; f.x = Math.random()*cw; }
    if(f.x < -12) f.x = cw+8;
    if(f.x > cw+12) f.x = -8;
  }
}
function drawLeaves(){
  if(leaves.length===0) return;
  ctx.save();
  for(var i=0;i<leaves.length;i++){
    var lv = leaves[i];
    ctx.save();
    ctx.translate(lv.x, lv.y);
    ctx.rotate(lv.rot);
    ctx.fillStyle = 'rgba(120,150,60,0.85)';
    ctx.beginPath(); ctx.ellipse(0,0,0.006*cw, 0.003*cw, 0,0,TAU); ctx.fill();
    ctx.fillStyle = 'rgba(160,170,70,0.5)';
    ctx.beginPath(); ctx.ellipse(0,0,0.0035*cw,0.002*cw,0,0,TAU); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
function mgmtLeaves(dt){
  for(var i=leaves.length-1;i>=0;i--){
    var lv = leaves[i];
    lv.x += lv.vx*dt; lv.y += lv.vy*dt; lv.rot += lv.vr*dt;
    lv.vy += cw*0.004*dt;
    if(lv.x < -60 || lv.x > cw+60 || lv.y > ch+60) leaves.splice(i,1);
  }
}
function drawSnowLayers(st){
  if(S.snow<0.25) return;
  var a = (S.snow-0.25)/0.75*0.45;
  ctx.fillStyle = cstr([255,255,255], a);

}
function drawVignette(){
  var g = ctx.createRadialGradient(cw*0.5, ch*0.45, Math.min(cw,ch)*0.5, cw*0.5, ch*0.5, Math.max(cw,ch)*0.75);
  g.addColorStop(0, cstr([0,0,0],0));
  g.addColorStop(1, cstr([0,0,0],0.28));
  ctx.fillStyle = g;
  ctx.fillRect(0,0,cw,ch);
}

function drawFireworks(day){
  if(day>=0.5) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var FWPAL = [[255,120,120],[255,220,120],[150,200,255],[170,255,180],[255,160,240],[255,255,255]];
  var nb = 5;
  for(var fb=0; fb<nb; fb++){
    var t = ((simT/2.6) + fb/nb) % 1;
    var bx = (0.12 + rnd(fb*3.13)*0.76) * cw;
    var by = (0.07 + rnd(fb*7.71)*0.26) * ch;
    var alpha = (t<0.12 ? t/0.12 : (1-(t-0.12)/0.88));
    if(alpha<=0.02) continue;
    var rad = (0.015 + t*0.13)*cw;
    ctx.strokeStyle = cstr(FWPAL[fb%FWPAL.length], alpha*0.3);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(bx, by-0.02*ch); ctx.lineTo(bx, by); ctx.stroke();
    ctx.fillStyle = cstr([255,255,240], alpha*0.5);
    ctx.beginPath(); ctx.arc(bx, by, 0.006*cw*(1-t*0.5), 0, TAU); ctx.fill();
    for(var pi2=0; pi2<28; pi2++){
      var a2 = (pi2/28)*TAU;
      var rr = rad*(0.75+0.25*rnd(fb*5.1+pi2));
      var px = bx + Math.cos(a2)*rr;
      var py = by + Math.sin(a2)*rr + t*t*0.05*ch;
      var col = FWPAL[(fb+pi2)%FWPAL.length];
      ctx.fillStyle = cstr(col, alpha*0.85);
      ctx.beginPath(); ctx.arc(px, py, 0.0018*cw, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}
function drawCastleScene(st){
  var day = st.day, nt = 1-day;
  var stone = mixc([186,182,176],[70,72,86],nt);
  var stoneS = mixc([138,134,130],[44,46,60],nt);
  var stoneL = mixc([222,218,210],[98,100,116],nt);
  var pale = mixc([252,240,230],[246,218,214],nt);
  var rose = mixc([246,206,204],[236,184,192],nt);
  var roseL = mixc([255,232,226],[255,216,216],nt);
  var roseS = mixc([212,160,164],[186,128,150],nt);
  var co = mixc([46,98,178],[78,116,208],nt);
  var coL = mixc([104,154,216],[132,164,238],nt);
  var coS = mixc([24,56,128],[44,70,160],nt);
  var gold = mixc(GOLD,[210,170,80],nt);
  var gbl = mixc([255,213,120],[240,205,120],nt);
  var water = mixc([84,168,164],[14,30,46],nt);
  var waterD = mixc([52,120,126],[8,16,28],nt);
  var waterL = mixc([176,224,212],[40,60,78],nt);
  var lawn = mixc([118,176,106],[24,44,42],nt);
  var lawnL = mixc([150,200,122],[34,58,52],nt);
  var lawnS = mixc([80,134,78],[14,28,32],nt);
  var topi = mixc([44,104,64],[14,34,34],nt);
  var topiL = mixc([92,158,100],[26,54,50],nt);
  var topiS = mixc([28,76,48],[8,22,24],nt);
  var farT = mixc([92,140,104],[14,24,38],nt);
  var farTD = mixc([66,112,82],[10,18,30],nt);
  var winN = mixc(NAVY,[22,28,46],nt);
  var lit = day<0.5;
  var wf = Math.min(1, S.wind/60);
  var yB = 0.535;
  ctx.save();

  // Fondo: césped lejano y arboleda
  ctx.fillStyle = cstr(lawn,1);

  for(var bt=0; bt<3; bt++){

      ctx.fillStyle = bp ? cstr(mixc(btC,[255,255,220],0.16*day),0.7) : cstr(btC,1);
      ctx.beginPath();
      for(var bi=0; bi<=btN; bi++){
        var btx = (bi/btN)*cw + (rnd(bi*3.3+bt*17)-0.5)*0.02*cw;
        var btr = (0.022 + rnd(bi*5.9+bt*7)*0.02)*cw*(bt===2?0.8:(bt===0?0.9:1));
        var bty = [0.548,0.566,0.586][bt]*ch - rnd(bi*2.1+bt)*0.02*ch;
        if(bp){ btx -= btr*0.28; bty -= btr*0.32; btr *= 0.5; }
        ctx.moveTo(btx+btr, bty);

      }
      ctx.fill();
    }
    if(bt===0){
      // cipreses asomando sobre la arboleda
      ctx.fillStyle = cstr(mixc(farTD,hazeT,0.3),1);
      var CYP = [0.03,0.075,0.20,0.245,0.29,0.705,0.75,0.83,0.875,0.965];
      for(var cyi=0; cyi<CYP.length; cyi++){
        var cyh = (0.07+rnd(cyi*4.4)*0.035)*ch, cyx = CYP[cyi]*cw + Math.sin(simT*1.3+cyi)*wf*0.002*cw;
        ctx.beginPath();
        ctx.moveTo(CYP[cyi]*cw-0.007*cw, 0.57*ch);
        ctx.quadraticCurveTo(CYP[cyi]*cw-0.010*cw, 0.57*ch-cyh*0.5, cyx, 0.57*ch-cyh);
        ctx.quadraticCurveTo(CYP[cyi]*cw+0.010*cw, 0.57*ch-cyh*0.5, CYP[cyi]*cw+0.007*cw, 0.57*ch);
        ctx.closePath(); ctx.fill();
      }
    }
  }
  ctx.fillStyle = cstr(farT,1);
  ctx.fillRect(0, ch*0.585, cw, ch*0.03);
  var lg0 = ctx.createLinearGradient(0, ch*0.60, 0, ch*0.77);
  lg0.addColorStop(0, cstr(lawnS,1)); lg0.addColorStop(0.35, cstr(lawn,1)); lg0.addColorStop(1, cstr(lawnL,1));
  ctx.fillStyle = lg0;
  ctx.fillRect(0, ch*0.605, cw, ch*0.17);

  // Foso
  var pcx = 0.50*cw, pcy = 0.655*ch, prx = 0.40*cw, pry = 0.068*ch;
  ctx.save();
  ctx.beginPath(); ctx.ellipse(pcx, pcy, prx, pry, 0, 0, TAU); ctx.clip();
  var mg = ctx.createLinearGradient(0, pcy-pry, 0, pcy+pry);
  mg.addColorStop(0,cstr(waterD,1)); mg.addColorStop(0.55,cstr(water,1)); mg.addColorStop(1,cstr(waterL,1));
  ctx.fillStyle = mg;
  ctx.fillRect(pcx-prx, pcy-pry, prx*2, pry*2);
  for(var rf=0; rf<26; rf++){
    var rfx = (0.36 + rnd(rf*4.7)*0.28)*cw + Math.sin(simT*1.3+rf)*0.004*cw;
    var rfy = (0.672 + rnd(rf*8.3)*0.05)*ch;
    ctx.fillStyle = cstr(rf%3 ? rose : coL, lit ? 0.30 : 0.22);
    ctx.fillRect(rfx, rfy, (0.010+rnd(rf)*0.02)*cw, 0.003*ch);
  }
  ctx.strokeStyle = cstr(waterL, 0.55); ctx.lineWidth = 1.2;
  ctx.beginPath();
  for(var rp=0; rp<46; rp++){
    var rpx = pcx - prx + ((rnd(rp*6.1) + simT*0.004*(1+wf*3)) % 1)*prx*2;
    var rpy = pcy - pry*0.75 + rnd(rp*9.7)*pry*1.7 + Math.sin(simT*1.1+rp)*0.0015*ch;
    var rpw = (0.006 + rnd(rp*2.3)*0.012)*cw;
    ctx.moveTo(rpx, rpy); ctx.lineTo(rpx+rpw, rpy);
  }
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = cstr(stoneS,1); ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(pcx, pcy, prx, pry, 0, 0, Math.PI); ctx.stroke();
  ctx.strokeStyle = cstr(stoneL,0.9); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(pcx, pcy+2, prx, pry, 0, 0, Math.PI); ctx.stroke();

  // Colina
  var hg = ctx.createLinearGradient(0, 0.50*ch, 0, 0.69*ch);
  hg.addColorStop(0, cstr(lawnL,1)); hg.addColorStop(0.5, cstr(lawn,1)); hg.addColorStop(1, cstr(lawnS,1));
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.moveTo(0.17*cw, 0.648*ch);
  ctx.bezierCurveTo(0.24*cw, 0.61*ch, 0.28*cw, 0.515*ch, 0.33*cw, 0.515*ch);
  ctx.lineTo(0.67*cw, 0.515*ch);
  ctx.bezierCurveTo(0.72*cw, 0.515*ch, 0.76*cw, 0.61*ch, 0.83*cw, 0.648*ch);
  ctx.quadraticCurveTo(0.50*cw, 0.695*ch, 0.17*cw, 0.648*ch);
  ctx.closePath(); ctx.fill();

  function tower(fx, fw, fyb, fyt){
    var cx = fx*cw, w = fw*cw, yb = fyb*ch, yt = fyt*ch, x0 = cx-w/2;
    var g = ctx.createLinearGradient(x0,0,x0+w,0);
    g.addColorStop(0,cstr(roseS,1)); g.addColorStop(0.28,cstr(roseL,1));
    g.addColorStop(0.62,cstr(rose,1)); g.addColorStop(1,cstr(roseS,1));
    ctx.fillStyle = g;
    ctx.fillRect(x0, yt, w, yb-yt);
    ctx.strokeStyle = cstr(roseS,0.22); ctx.lineWidth = 1;
    ctx.beginPath();
    for(var sy=yt+0.034*ch; sy<yb; sy+=0.022*ch){ ctx.moveTo(x0,sy); ctx.lineTo(x0+w,sy); }
    ctx.stroke();
    var kw = w*1.22, kh = 0.014*ch, kx = cx-kw/2;
    var kg = ctx.createLinearGradient(kx,0,kx+kw,0);
    kg.addColorStop(0,cstr(roseS,1)); kg.addColorStop(0.28,cstr(pale,1)); kg.addColorStop(1,cstr(roseS,1));
    ctx.fillStyle = kg;
    ctx.fillRect(kx, yt, kw, kh);
    ctx.fillStyle = cstr(roseS,0.5);
    ctx.fillRect(x0, yt+kh, w, 0.004*ch);
    var kn = Math.max(3, Math.round(kw/(0.0046*cw)));
    ctx.fillStyle = cstr(roseS,0.75);
    for(var ki=0; ki<kn; ki++) ctx.fillRect(kx+(ki+0.25)*kw/kn, yt+kh*0.5, kw/kn*0.5, kh*0.5);
  }
  function finial(cx, yp, flag){
    ctx.strokeStyle = cstr(gbl,1); ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(cx, yp+0.004*ch); ctx.lineTo(cx, yp-0.024*ch); ctx.stroke();
    ctx.fillStyle = cstr(gbl,1);
    ctx.beginPath(); ctx.arc(cx, yp-0.003*ch, 0.0024*cw, 0, TAU); ctx.fill();
    if(flag){
      var fwv = Math.sin(simT*3+cx*0.05)*0.003*ch*(0.5+wf);
      ctx.beginPath();
      ctx.moveTo(cx, yp-0.024*ch);
      ctx.lineTo(cx+0.013*cw, yp-0.019*ch+fwv);
      ctx.lineTo(cx, yp-0.014*ch);
      ctx.closePath(); ctx.fill();
    }
  }
  // Tejado cónico de pizarra (sq: tejado a cuatro aguas de torre cuadrada)
  function cone(fx, fw, fyb, fyp, flag, sq){
    var cx = fx*cw, w = fw*cw, yb = fyb*ch, yp = fyp*ch, hh = yb-yp;
    var g = ctx.createLinearGradient(cx-w/2,0,cx+w/2,0);
    g.addColorStop(0,cstr(co,1)); g.addColorStop(0.3,cstr(coL,1));
    g.addColorStop(0.62,cstr(co,1)); g.addColorStop(1,cstr(coS,1));
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx-w/2, yb);
    if(sq){ ctx.lineTo(cx, yp); ctx.lineTo(cx+w/2, yb); }
    else {
      ctx.quadraticCurveTo(cx-w*0.13, yb-hh*0.26, cx, yp);
      ctx.quadraticCurveTo(cx+w*0.13, yb-hh*0.26, cx+w/2, yb);
    }
    ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
    ctx.clip();
    ctx.strokeStyle = cstr(coS,0.42); ctx.lineWidth = 1;
    ctx.beginPath();
    var bow = sq ? 0 : w*0.07;
    for(var sy=yb-0.006*ch; sy>yp; sy-=0.011*ch){
      ctx.moveTo(cx-w/2, sy-bow); ctx.quadraticCurveTo(cx, sy+bow, cx+w/2, sy-bow);
    }
    if(sq){ ctx.moveTo(cx, yp); ctx.lineTo(cx+w*0.1, yb); }
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = cstr(gold, lit ? 0.55 : 0.9);
    ctx.fillRect(cx-w/2, yb-0.003*ch, w, 0.004*ch);
    finial(cx, yp, flag);
  }
  function crenWall(fx0, fx1, fyb, fyt){
    var x0 = fx0*cw, x1 = fx1*cw, yb = fyb*ch, yt = fyt*ch;
    var g = ctx.createLinearGradient(0,yt,0,yb);
    g.addColorStop(0,cstr(roseL,1)); g.addColorStop(0.3,cstr(rose,1)); g.addColorStop(1,cstr(mixc(rose,roseS,0.65),1));
    ctx.fillStyle = g;
    ctx.fillRect(x0, yt, x1-x0, yb-yt);
    var n = Math.max(2, Math.floor((x1-x0)/(0.012*cw))), step = (x1-x0)/n;
    ctx.fillStyle = cstr(roseL,1);
    for(var mi=0; mi<n; mi++) ctx.fillRect(x0+mi*step+step*0.2, yt-0.011*ch, step*0.6, 0.012*ch);
    ctx.fillStyle = cstr(pale,1);
    ctx.fillRect(x0, yt, x1-x0, 0.004*ch);
    ctx.fillStyle = cstr(roseS,0.4);
    ctx.fillRect(x0, yt+0.004*ch, x1-x0, 0.004*ch);
    ctx.strokeStyle = cstr(roseS,0.22); ctx.lineWidth = 1;
    ctx.beginPath();
    var rh = 0.02*ch, bw = 0.016*cw, row = 0;
    for(var sy=yt+0.018*ch; sy<yb; sy+=rh, row++){
      ctx.moveTo(x0,sy); ctx.lineTo(x1,sy);
      for(var sx=x0+(row%2?bw*0.5:bw); sx<x1; sx+=bw){ ctx.moveTo(sx,sy); ctx.lineTo(sx,Math.min(yb,sy+rh)); }
    }
    ctx.stroke();
  }
  function win(fx, fy, fr, fh){
    var cx = fx*cw, y = fy*ch, r = fr*cw, h = fh*ch;
    ctx.beginPath();
    ctx.moveTo(cx-r, y+h); ctx.lineTo(cx-r, y);
    ctx.quadraticCurveTo(cx-r, y-r*1.5, cx, y-r*2.2);
